<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plant Relationship Network — Permaculture Knowledge Graph</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;800&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e0a;
  --panel:#0f1810;
  --border:#1f3020;
  --text:#c8d8c0;
  --text-dim:#5a7050;
  --accent:#4caf50;
  --green:#27ae60;
  --red:#e74c3c;
  --amber:#f39c12;
  --gray:#7f8c8d;
  --purple:#8e44ad;
  --blue:#3498db;
  --font-mono:'Space Mono',monospace;
  --font-display:'Syne',sans-serif;
  /* Categories */
  --c-hub:#c0392b;
  --c-nfixer:#2ecc71;
  --c-pioneer:#e67e22;
  --c-food:#f1c40f;
  --c-annual:#ff7675;
  --c-ground:#1abc9c;
  --c-grass:#a8b5a0;
  --c-herb:#a29bfe;
  --c-aquatic:#74b9ff;
  --c-remediator:#00cec9;
  --c-indicator:#636e72;
  --c-rootstock:#b2bec3;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-mono)}

/* ─── LAYOUT ─── */
#app{display:flex;height:100vh;width:100vw}
#graph-area{flex:1;position:relative;overflow:hidden}
#sidebar{width:300px;min-width:280px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}

/* ─── HEADER ─── */
#header{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
#header h1{font-family:var(--font-display);font-size:13px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);line-height:1.3}
#header p{font-size:9px;color:var(--text-dim);margin-top:3px;letter-spacing:0.05em}

/* ─── SEARCH ─── */
#search-wrap{padding:10px 12px;border-bottom:1px solid var(--border)}
#search{width:100%;background:#060a06;border:1px solid var(--border);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:7px 10px;border-radius:2px;outline:none}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:var(--text-dim)}

/* ─── CONTROLS ─── */
#controls{padding:10px 12px;border-bottom:1px solid var(--border)}
.ctrl-label{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px}
.toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;cursor:pointer}
.toggle-row label{font-size:10px;cursor:pointer;color:var(--text)}
.toggle-row input[type=checkbox]{accent-color:var(--accent);cursor:pointer}

/* ─── EDGE FILTERS ─── */
#edge-filters{padding:10px 12px;border-bottom:1px solid var(--border)}
.edge-item{display:flex;align-items:center;gap:8px;margin-bottom:5px;cursor:pointer}
.edge-swatch{width:28px;height:3px;border-radius:1px;flex-shrink:0}
.edge-label{font-size:10px;cursor:pointer;color:var(--text);flex:1}
.edge-count{font-size:9px;color:var(--text-dim)}
.edge-item input{accent-color:var(--accent);cursor:pointer}

/* ─── CATEGORY LEGEND ─── */
#cat-legend{padding:10px 12px;border-bottom:1px solid var(--border)}
.cat-item{display:flex;align-items:center;gap:7px;margin-bottom:4px;cursor:pointer;border-radius:2px;padding:2px 3px;transition:background .15s}
.cat-item:hover{background:#ffffff08}
.cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cat-name{font-size:10px;flex:1;cursor:pointer}
.cat-ct{font-size:9px;color:var(--text-dim)}
.cat-item.off .cat-name{color:var(--text-dim)}
.cat-item.off .cat-dot{opacity:.3}

/* ─── NODE DETAIL PANEL ─── */
#detail-panel{flex:1;overflow-y:auto;padding:12px;font-size:11px}
#detail-panel::-webkit-scrollbar{width:4px}
#detail-panel::-webkit-scrollbar-thumb{background:var(--border)}
#detail-empty{color:var(--text-dim);font-size:10px;padding:8px 0}
#detail-title{font-family:var(--font-display);font-size:14px;font-weight:800;margin-bottom:2px;color:#fff}
#detail-sci{font-style:italic;font-size:9px;color:var(--text-dim);margin-bottom:8px}
#detail-cat-badge{display:inline-block;font-size:9px;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:2px;margin-bottom:10px}
.rel-section-title{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:8px 0 4px;border-bottom:1px solid var(--border);padding-bottom:3px}
.rel-item{display:flex;align-items:flex-start;gap:6px;margin-bottom:4px;padding:4px 5px;background:#ffffff05;border-radius:2px;border-left:2px solid transparent}
.rel-item .rel-arrow{font-size:10px;flex-shrink:0;margin-top:1px}
.rel-item .rel-target{font-size:10px;color:#dfe6e9}
.rel-item .rel-conf{font-size:9px;color:var(--text-dim);margin-left:auto;flex-shrink:0}
.conf-H{color:#2ecc71}
.conf-M{color:#f39c12}
.conf-L{color:#e74c3c}

/* ─── TOOLTIP ─── */
#tooltip{position:fixed;background:var(--panel);border:1px solid var(--border);padding:7px 10px;font-size:10px;pointer-events:none;display:none;border-radius:2px;max-width:200px;z-index:100;box-shadow:0 4px 20px #000a}
#tooltip strong{font-family:var(--font-display);font-size:12px;color:#fff;display:block;margin-bottom:2px}
#tooltip em{color:var(--text-dim);font-style:italic}
#tooltip .tt-links{color:var(--accent);font-size:9px;margin-top:3px}

/* ─── STATS BAR ─── */
#stats-bar{position:absolute;bottom:10px;left:10px;display:flex;gap:12px;pointer-events:none}
.stat-chip{background:#0f1810cc;border:1px solid var(--border);padding:4px 9px;font-size:9px;letter-spacing:.07em;border-radius:2px;color:var(--text-dim)}
.stat-chip strong{color:var(--text)}

/* ─── SVG ─── */
svg{width:100%;height:100%;cursor:grab}
svg:active{cursor:grabbing}
.link{stroke-opacity:.75;transition:stroke-opacity .2s}
.link.dimmed{stroke-opacity:.06}
.node circle{stroke-width:1.5px;cursor:pointer;transition:opacity .2s}
.node circle:hover{stroke-width:2.5px}
.node.dimmed circle{opacity:.1}
.node.dimmed text{opacity:.08}
.node text{pointer-events:none;text-anchor:middle;dominant-baseline:central;font-family:var(--font-mono);fill:#fff;font-size:9px;paint-order:stroke;stroke:#0a0e0a;stroke-width:3px}
.node.hub-node text{font-size:10px;font-weight:700}
.node.hub-node circle{stroke-width:3px}

/* ─── ISOLATED LIST ─── */
#isolated-panel{position:absolute;bottom:0;left:0;right:300px;background:var(--panel);border-top:1px solid var(--border);max-height:0;overflow:hidden;transition:max-height .3s ease}
#isolated-panel.open{max-height:160px;overflow-y:auto}
#isolated-toggle{position:absolute;bottom:0;left:0;right:300px;background:var(--panel);border-top:1px solid var(--border);padding:6px 14px;cursor:pointer;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim);display:flex;justify-content:space-between;z-index:10}
#isolated-toggle:hover{background:#0f1810}
#isolated-toggle .arrow{transition:transform .3s}
#isolated-toggle.open .arrow{transform:rotate(180deg)}
#isolated-content{padding:10px 14px 8px}
#isolated-content .iso-title{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:7px}
#iso-plant-list{display:flex;flex-wrap:wrap;gap:4px}
.iso-tag{background:#060a06;border:1px solid var(--border);padding:2px 7px;font-size:9px;border-radius:2px;color:var(--text-dim);cursor:default}
.iso-tag:hover{border-color:var(--accent);color:var(--text)}

/* ─── SCROLLBAR ─── */
*::-webkit-scrollbar{width:4px;height:4px}
*::-webkit-scrollbar-track{background:#060a06}
*::-webkit-scrollbar-thumb{background:#1f3020}
</style>
</head>
<body>
<div id="app">
  <div id="graph-area">
    <svg id="viz"></svg>
    <div id="stats-bar">
      <div class="stat-chip">Nodes: <strong id="stat-nodes">-</strong></div>
      <div class="stat-chip">Edges: <strong id="stat-edges">-</strong></div>
      <div class="stat-chip">Showing: <strong id="stat-showing">all</strong></div>
    </div>
    <div id="isolated-toggle" onclick="toggleIsolated()">
      <span>⬇ Plants awaiting relationship extraction (<span id="iso-count">0</span>)</span>
      <span class="arrow">▲</span>
    </div>
    <div id="isolated-panel">
      <div id="isolated-content">
        <div class="iso-title">Isolated nodes — no documented edges yet. Tag for future processing.</div>
        <div id="iso-plant-list"></div>
      </div>
    </div>
  </div>
  <div id="sidebar">
    <div id="header">
      <h1>Plant Relationship<br>Network</h1>
      <p>Permaculture Knowledge Graph · 3 sources · ~300 videos</p>
    </div>
    <div id="search-wrap">
      <input id="search" type="text" placeholder="Search plant..." autocomplete="off">
    </div>
    <div id="controls">
      <div class="ctrl-label">Display</div>
      <div class="toggle-row"><input type="checkbox" id="tog-isolated" onchange="toggleIsolatedNodes()"><label for="tog-isolated">Hide isolated nodes</label></div>
      <div class="toggle-row"><input type="checkbox" id="tog-cluster" onchange="toggleCluster()"><label for="tog-cluster">Cluster by category</label></div>
      <div class="toggle-row"><input type="checkbox" id="tog-labels" checked onchange="toggleLabels()"><label for="tog-labels">Show labels</label></div>
      <div class="toggle-row"><input type="checkbox" id="tog-conf" onchange="toggleLowConf()"><label for="tog-conf">Hide low-confidence edges</label></div>
    </div>
    <div id="edge-filters">
      <div class="ctrl-label">Edge Types</div>
    </div>
    <div id="cat-legend">
      <div class="ctrl-label">Categories</div>
    </div>
    <div id="detail-panel">
      <div id="detail-empty">Click any node to see relationships</div>
    </div>
  </div>
</div>
<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

  if (!e.isolated_skip) {
    connCount[e.s] = (connCount[e.s]||0) + 1;
    connCount[e.t] = (connCount[e.t]||0) + 1;
  }
});

const nodes = RAW_NODES.map(n => ({...n, connections: connCount[n.id]||0}));
const edges = RAW_EDGES.map((e,i) => ({...e, id:i}));

// Active filter state
const activeEdgeTypes = new Set(Object.keys(EDGE_TYPES));
const activeCategories = new Set(Object.keys(CATEGORIES));
let hideIsolated = false;
let hideLabels = false;
let hideLowConf = false;
let useClusters = false;
let selectedNode = null;
let searchTerm = '';

// Cluster positions (% of width/height)
const CLUSTER_POS = {
  hub:          {x:0.50, y:0.50},
  nitrogen_fixer:{x:0.20,y:0.25},
  pioneer:      {x:0.20, y:0.75},
  food_tree:    {x:0.70, y:0.28},
  food_annual:  {x:0.80, y:0.65},
  ground_cover: {x:0.35, y:0.80},
  grass_bamboo: {x:0.15, y:0.50},
  herb:         {x:0.65, y:0.80},
  aquatic:      {x:0.85, y:0.35},
  remediator:   {x:0.85, y:0.15},
  indicator:    {x:0.35, y:0.15},
  rootstock:    {x:0.60, y:0.15},
};

// ═══════════════════════════════════════════════════════════════
// BUILD UI
// ═══════════════════════════════════════════════════════════════

function buildEdgeFilters() {
  const container = document.getElementById('edge-filters');
  const counts = {};
  edges.forEach(e => counts[e.type] = (counts[e.type]||0)+1);
  Object.entries(EDGE_TYPES).forEach(([key,cfg]) => {
    const div = document.createElement('div');
    div.className = 'edge-item';
    const dashStyle = cfg.dash === 'none'
      ? `background:${cfg.stroke};height:2px`
      : `background:repeating-linear-gradient(90deg,${cfg.stroke} 0,${cfg.stroke} 8px,transparent 8px,transparent 14px);height:2px`;
    div.innerHTML = `
      <input type="checkbox" id="et-${key}" checked onchange="toggleEdgeType('${key}')">
      <span class="edge-swatch" style="${dashStyle}"></span>
      <label class="edge-label" for="et-${key}">${cfg.label}</label>
      <span class="edge-count">${counts[key]||0}</span>`;
    container.appendChild(div);
  });
}

function buildCatLegend() {
  const container = document.getElementById('cat-legend');
  const counts = {};
  nodes.forEach(n => counts[n.cat] = (counts[n.cat]||0)+1);
  Object.entries(CATEGORIES).forEach(([key,cfg]) => {
    const div = document.createElement('div');
    div.className = 'cat-item';
    div.id = `cat-${key}`;
    div.innerHTML = `
      <div class="cat-dot" style="background:${cfg.color}"></div>
      <span class="cat-name">${cfg.label}</span>
      <span class="cat-ct">${counts[key]||0}</span>`;
    div.onclick = () => toggleCategory(key);
    container.appendChild(div);
  });
}

function buildIsolatedList() {
  const iso = nodes.filter(n => n.isolated);
  document.getElementById('iso-count').textContent = iso.length;
  const container = document.getElementById('iso-plant-list');
  iso.forEach(n => {
    const tag = document.createElement('span');
    tag.className = 'iso-tag';
    tag.textContent = n.label;
    tag.title = n.sci || '';
    container.appendChild(tag);
  });
}

// ═══════════════════════════════════════════════════════════════
// D3 GRAPH
// ═══════════════════════════════════════════════════════════════

const svg = d3.select('#viz');
let W = 0, H = 0;

const g = svg.append('g');
const linkGroup = g.append('g').attr('class','links');
const nodeGroup = g.append('g').attr('class','nodes');

// Arrow markers
const defs = svg.append('defs');
Object.entries(EDGE_TYPES).forEach(([key,cfg]) => {
  defs.append('marker')
    .attr('id',`arrow-${key}`)
    .attr('viewBox','0 -5 10 10')
    .attr('refX',18).attr('refY',0)
    .attr('markerWidth',5).attr('markerHeight',5)
    .attr('orient','auto')
    .append('path')
    .attr('d','M0,-5L10,0L0,5')
    .attr('fill',cfg.stroke)
    .attr('opacity',.7);
});

const zoom = d3.zoom()
  .scaleExtent([0.1, 4])
  .on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

// Force simulation
const simulation = d3.forceSimulation()
  .force('link', d3.forceLink().id(d => d.id).distance(d => {
    if (d.type === 'soil_restore' || d.type === 'soil_exhaust') return 100;
    if (d.type === 'grafting') return 80;
    return 130;
  }).strength(0.3))
  .force('charge', d3.forceManyBody().strength(d => d.isolated ? -30 : -200))
  .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 12))
  .force('center', d3.forceCenter())
  .alphaDecay(0.02)
  .on('tick', ticked);

function nodeRadius(d) {
  if (d.id === 'SOIL') return 24;
  const base = 8;
  const extra = Math.min(d.connections * 2.5, 18);
  return base + extra;
}

function getVisibleNodes() {
  return nodes.filter(n => {
    if (hideIsolated && n.isolated) return false;
    if (!activeCategories.has(n.cat)) return false;
    return true;
  });
}

function getVisibleEdges(visNodeIds) {
  return edges.filter(e => {
    if (!activeEdgeTypes.has(e.type)) return false;
    if (hideLowConf && e.conf === 'L') return false;
    if (!visNodeIds.has(e.s) || !visNodeIds.has(e.t)) return false;
    return true;
  });
}

function render() {
  const visNodes = getVisibleNodes();
  const visNodeIds = new Set(visNodes.map(n => n.id));
  const visEdges = getVisibleEdges(visNodeIds);

  document.getElementById('stat-nodes').textContent = visNodes.length;
  document.getElementById('stat-edges').textContent = visEdges.length;
  document.getElementById('stat-showing').textContent =
    (hideIsolated ? 'connected' : 'all') + (searchTerm ? ` · "${searchTerm}"` : '');

  // Links
  const link = linkGroup.selectAll('.link')
    .data(visEdges, d => d.id)
    .join(
      enter => enter.append('line').attr('class', d => `link link-${d.type}`),
      update => update,
      exit => exit.remove()
    )
    .attr('stroke', d => EDGE_TYPES[d.type].stroke)
    .attr('stroke-width', d => EDGE_TYPES[d.type].width)
    .attr('stroke-dasharray', d => EDGE_TYPES[d.type].dash === 'none' ? null : EDGE_TYPES[d.type].dash)
    .attr('marker-end', d => {
      const directed = ['hostile','soil_restore','soil_exhaust','support'];
      return directed.includes(d.type) ? `url(#arrow-${d.type})` : null;
    });

  // Nodes
  const node = nodeGroup.selectAll('.node')
    .data(visNodes, d => d.id)
    .join(
      enter => {
        const g = enter.append('g')
          .attr('class', d => `node${d.id==='SOIL'?' hub-node':''}${d.isolated?' isolated-node':''}`)
          .call(d3.drag()
            .on('start', dragStarted)
            .on('drag', dragged)
            .on('end', dragEnded))
          .on('click', (event, d) => {
            event.stopPropagation();
            selectNode(d);
          })
          .on('mouseover', (event, d) => showTooltip(event, d))
          .on('mousemove', (event) => moveTooltip(event))
          .on('mouseout', hideTooltip);

        g.append('circle')
          .attr('r', d => nodeRadius(d))
          .attr('fill', d => CATEGORIES[d.cat]?.color || '#555')
          .attr('stroke', d => d.isolated ? '#2a3a2a' : d3.color(CATEGORIES[d.cat]?.color)?.brighter(0.5) || '#fff')
          .attr('fill-opacity', d => d.isolated ? 0.3 : 0.85);

        g.append('text')
          .text(d => d.label.length > 14 ? d.label.slice(0,12)+'…' : d.label)
          .attr('dy', d => nodeRadius(d) + 10)
          .attr('font-size', d => d.id==='SOIL' ? '11px' : '9px')
          .attr('fill', d => d.isolated ? '#4a5a4a' : '#dfe6e9');

        return g;
      },
      update => update,
      exit => exit.remove()
    );

  // Labels visibility
  nodeGroup.selectAll('text').style('display', hideLabels ? 'none' : null);

  simulation.nodes(visNodes);
  simulation.force('link').links(visEdges);

  // Cluster force
  if (useClusters) {
    simulation.force('cluster', clusterForce());
  } else {
    simulation.force('cluster', null);
  }

  // SOIL hub pinning
  const soilNode = visNodes.find(n => n.id === 'SOIL');
  if (soilNode) { soilNode.fx = W/2; soilNode.fy = H/2; }

  simulation.alpha(0.5).restart();
}

function clusterForce() {
  return function(alpha) {
    nodes.forEach(node => {
      const cp = CLUSTER_POS[node.cat];
      if (!cp) return;
      node.vx = (node.vx || 0) + (cp.x * W - node.x) * alpha * 0.08;
      node.vy = (node.vy || 0) + (cp.y * H - node.y) * alpha * 0.08;
    });
  };
}

function ticked() {
  linkGroup.selectAll('.link')
    .attr('x1', d => d.source.x)
    .attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x)
    .attr('y2', d => d.target.y);

  nodeGroup.selectAll('.node')
    .attr('transform', d => `translate(${d.x||0},${d.y||0})`);

  applyHighlight();
}

// ═══════════════════════════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════════════════════════

function selectNode(d) {
  selectedNode = d;
  applyHighlight();
  showDetail(d);
}

svg.on('click', () => {
  selectedNode = null;
  applyHighlight();
  document.getElementById('detail-panel').innerHTML = '<div id="detail-empty">Click any node to see relationships</div>';
});

function applyHighlight() {
  const term = searchTerm.toLowerCase();

  if (!selectedNode && !term) {
    nodeGroup.selectAll('.node').classed('dimmed', false);
    linkGroup.selectAll('.link').classed('dimmed', false);
    return;
  }

  if (term) {
    nodeGroup.selectAll('.node').classed('dimmed', d =>
      !d.label.toLowerCase().includes(term) && !d.sci?.toLowerCase().includes(term)
    );
    linkGroup.selectAll('.link').classed('dimmed', d => {
      const sMatch = d.source.label?.toLowerCase().includes(term) || d.source.sci?.toLowerCase().includes(term);
      const tMatch = d.target.label?.toLowerCase().includes(term) || d.target.sci?.toLowerCase().includes(term);
      return !sMatch && !tMatch;
    });
    return;
  }

  if (selectedNode) {
    const neighbors = new Set([selectedNode.id]);
    edges.forEach(e => {
      if (e.s === selectedNode.id) neighbors.add(e.t);
      if (e.t === selectedNode.id) neighbors.add(e.s);
    });
    nodeGroup.selectAll('.node').classed('dimmed', d => !neighbors.has(d.id));
    linkGroup.selectAll('.link').classed('dimmed', d =>
      d.source.id !== selectedNode.id && d.target.id !== selectedNode.id
    );
  }
}

function showDetail(d) {
  const panel = document.getElementById('detail-panel');
  const catCfg = CATEGORIES[d.cat] || {};
  const rels = edges.filter(e => e.s === d.id || e.t === d.id);

  const byType = {};
  rels.forEach(e => {
    const type = e.type;
    if (!byType[type]) byType[type] = [];
    const other = e.s === d.id ? e.t : e.s;
    const dir = e.s === d.id ? '→' : '←';
    const otherNode = nodes.find(n => n.id === other);
    byType[type].push({node: otherNode||{label:other}, dir, conf:e.conf, note:e.note});
  });

  let html = `
    <div id="detail-title">${d.label}</div>
    <div id="detail-sci">${d.sci||''}</div>
    <div id="detail-cat-badge" style="background:${catCfg.color}22;color:${catCfg.color};border:1px solid ${catCfg.color}44">${catCfg.label||d.cat}</div>
    <div style="font-size:9px;color:var(--text-dim)">${d.connections} connections${d.isolated?' · awaiting extraction':''}</div>`;

  Object.entries(byType).forEach(([type, list]) => {
    const cfg = EDGE_TYPES[type] || {};
    html += `<div class="rel-section-title" style="color:${cfg.stroke||'#888'}">${cfg.label||type} (${list.length})</div>`;
    list.forEach(item => {
      html += `<div class="rel-item" style="border-left-color:${cfg.stroke||'#888'}">
        <span class="rel-arrow">${item.dir}</span>
        <div>
          <div class="rel-target">${item.node.label}</div>
          <div style="font-size:9px;color:var(--text-dim)">${item.note||''}</div>
        </div>
        <span class="rel-conf conf-${item.conf}">${item.conf}</span>
      </div>`;
    });
  });

  if (!rels.length) html += `<div style="color:var(--text-dim);font-size:10px;margin-top:8px">No relationships extracted yet. Add to processing list.</div>`;
  panel.innerHTML = html;
}

function showTooltip(event, d) {
  const tt = document.getElementById('tooltip');
  const catCfg = CATEGORIES[d.cat] || {};
  tt.innerHTML = `<strong>${d.label}</strong><em>${d.sci||''}</em><div class="tt-links">${d.connections} links · ${catCfg.label||d.cat}</div>`;
  tt.style.display = 'block';
  moveTooltip(event);
}
function moveTooltip(event) {
  const tt = document.getElementById('tooltip');
  tt.style.left = (event.clientX+14)+'px';
  tt.style.top = (event.clientY-10)+'px';
}
function hideTooltip() { document.getElementById('tooltip').style.display='none'; }

// Search
document.getElementById('search').addEventListener('input', function() {
  searchTerm = this.value.trim();
  if (searchTerm) {
    const match = nodes.find(n => n.label.toLowerCase() === searchTerm.toLowerCase());
    if (match) { selectedNode = match; showDetail(match); }
  } else { selectedNode = null; }
  applyHighlight();
});

// Toggles
function toggleEdgeType(key) {
  if (activeEdgeTypes.has(key)) activeEdgeTypes.delete(key);
  else activeEdgeTypes.add(key);
  render();
}

function toggleCategory(key) {
  const el = document.getElementById(`cat-${key}`);
  if (activeCategories.has(key)) {
    activeCategories.delete(key);
    el.classList.add('off');
  } else {
    activeCategories.add(key);
    el.classList.remove('off');
  }
  render();
}

function toggleIsolatedNodes() {
  hideIsolated = document.getElementById('tog-isolated').checked;
  render();
}

function toggleCluster() {
  useClusters = document.getElementById('tog-cluster').checked;
  render();
}

function toggleLabels() {
  hideLabels = !document.getElementById('tog-labels').checked;
  nodeGroup.selectAll('text').style('display', hideLabels ? 'none' : null);
}

function toggleLowConf() {
  hideLowConf = document.getElementById('tog-conf').checked;
  render();
}

let isolatedOpen = false;
function toggleIsolated() {
  isolatedOpen = !isolatedOpen;
  const panel = document.getElementById('isolated-panel');
  const toggle = document.getElementById('isolated-toggle');
  if (isolatedOpen) { panel.classList.add('open'); toggle.classList.add('open'); }
  else { panel.classList.remove('open'); toggle.classList.remove('open'); }
}

// Drag
function dragStarted(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(event, d) {
  d.fx = event.x; d.fy = event.y;
}
function dragEnded(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  if (d.id !== 'SOIL') { d.fx = null; d.fy = null; }
}

// ═══════════════════════════════════════════════════════════════
// RESIZE + INIT
// ═══════════════════════════════════════════════════════════════

function resize() {
  const area = document.getElementById('graph-area');
  W = area.clientWidth;
  H = area.clientHeight;
  svg.attr('width', W).attr('height', H);
  simulation.force('center', d3.forceCenter(W/2, H/2));
  const soilNode = nodes.find(n => n.id === 'SOIL');
  if (soilNode) { soilNode.fx = W/2; soilNode.fy = H/2; }
  simulation.alpha(0.3).restart();
}

window.addEventListener('resize', resize);

// Startup
buildEdgeFilters();
buildCatLegend();
buildIsolatedList();
resize();
render();
</script>
</body>
</html>
