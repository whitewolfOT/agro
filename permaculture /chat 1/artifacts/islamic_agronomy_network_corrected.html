["Pennyroyal","Wheat","P","Hung in granaries; repels grain insects — Ibn al-Awwam, Explicit"],
["Pennyroyal","Barley","P","Granary insect protection — Ibn al-Awwam, Explicit"],
["Wormwood","Wheat","P","Dried and placed; repels stored-grain insects — Ibn al-Awwam, Explicit"],
["Wormwood","Barley","P","Protects stored barley from insects — Ibn al-Awwam, Explicit"],
["Oleander","Olive","P","Toxic smoke from burned leaves; fumigant for olive pests — Ibn al-Awwam, Explicit"],
["Oleander","Fig","P","Fumigant smoke for fig pests — Ibn al-Awwam, Explicit"],
["Asafoetida","Grapevine","P","Resin buried near roots; repels soil insects — Ibn al-Awwam, Explicit"],
["Asafoetida","Fig","P","Soil pest repellent at fig base — Ibn al-Awwam, Explicit"],
["Stavesacre","Grapevine","P","Seed powder against vine lice and insects — Ibn al-Awwam, Explicit"],
["Squill","Wheat","P","Bulb as rodent-poison bait protecting grain stores — Ibn al-Awwam, Ibn Wahshiyya, Explicit"],
["Squill","Barley","P","Rodent bait for grain stores — Ibn al-Awwam, Explicit"],
["Henbane","Olive","P","Narcotic fumigant smoke for olive pests — Ibn Wahshiyya, Explicit"],
["Colocynth","Wheat","P","Bitter fruit as rodent bait (separate from its hostility via root toxins) — Ibn al-Awwam, Ibn Wahshiyya, Explicit"],
];

// ═══════════════════════════════════════════════════════════
//  BUILD GRAPH
// ═══════════════════════════════════════════════════════════
const nMap={};
RN.forEach(([id,cat])=>{nMap[id]={id,cat,links:[]};});
const links=RL.map(([s,t,type,note])=>{
  const src=nMap[s],tgt=nMap[t];
  if(!src){console.warn("Missing node:",s);return null;}
  if(!tgt){console.warn("Missing node:",t);return null;}
  src.links.push({to:t,type,note});
  tgt.links.push({to:s,type,note});
  return{source:s,target:t,type,note};
}).filter(Boolean);
const nodes=RN.map(([id,cat])=>({id,cat,degree:nMap[id].links.length,linkData:nMap[id].links}));

// ═══════════════════════════════════════════════════════════
//  D3 SETUP
// ═══════════════════════════════════════════════════════════
const svg=d3.select("#net");
const W=()=>document.getElementById("cv").clientWidth;
const H=()=>document.getElementById("cv").clientHeight;

// Markers
const defs=d3.select("#defs");
Object.entries(ET).forEach(([k,v])=>{
  defs.append("marker").attr("id","m-"+k)
    .attr("viewBox","0 -4 10 8").attr("refX",22).attr("refY",0)
    .attr("markerWidth",5).attr("markerHeight",5).attr("orient","auto")
    .append("path").attr("d","M0,-4L10,0L0,4")
    .attr("fill",v.c).attr("opacity",.75);
});

const gL=d3.select("#gl"),gN=d3.select("#gn"),gLb=d3.select("#glb");
let actT=new Set(Object.keys(ET)),actC=new Set(Object.keys(CAT));
let showConn=false,clMode=false,srch="",selN=null;

const nR=d=>{if(d.id==="SOIL")return 14;if(d.degree===0)return 3;return Math.min(4+d.degree*1.4,14);};

const sim=d3.forceSimulation(nodes)
  .force("link",d3.forceLink(links).id(d=>d.id).distance(d=>{
    if(d.type==="R"||d.type==="E")return 165;
    if(d.type==="Ro")return 140;
    if(d.type==="G")return 90;
    if(d.type==="S")return 115;
    if(d.type==="P")return 130;
    return 100;
  }).strength(0.5))
  .force("charge",d3.forceManyBody().strength(d=>{
    if(d.id==="SOIL")return -650;
    if(d.degree>8)return -300;
    if(d.degree>4)return -180;
    if(d.degree>0)return -100;
    return -40;
  }))
  .force("center",d3.forceCenter(W()/2,H()/2))
  .force("collide",d3.forceCollide(d=>nR(d)+9))
  .alphaDecay(0.02).velocityDecay(0.4);

const zoom=d3.zoom().scaleExtent([0.1,8]).on("zoom",e=>{
  gL.attr("transform",e.transform);
  gN.attr("transform",e.transform);
  gLb.attr("transform",e.transform);
});
svg.call(zoom);
svg.on("click",()=>{selN=null;updHL();hideInfo();});

let lkSel=gL.selectAll("line").data(links,d=>d.source+d.target+d.type).join("line")
  .attr("stroke",d=>ET[d.type].c)
  .attr("stroke-width",d=>ET[d.type].w)
  .attr("stroke-dasharray",d=>ET[d.type].dash)
  .attr("stroke-opacity",.55)
  .attr("marker-end",d=>"url(#m-"+d.type+")");

let ndSel=gN.selectAll("circle").data(nodes,d=>d.id).join("circle")
  .attr("r",d=>nR(d))
  .attr("fill",d=>CAT[d.cat]?.c||"#ccc")
  .attr("stroke",d=>d.id==="SOIL"?"#111":"rgba(255,255,255,0.85)")
  .attr("stroke-width",d=>d.id==="SOIL"?2:1.2)
  .attr("cursor","pointer")
  .on("mouseenter",showTT).on("mousemove",moveTT).on("mouseleave",hideTT)
  .on("click",(e,d)=>{e.stopPropagation();selN=d.id;updHL();showInfo(d);})
  .call(d3.drag()
    .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
    .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;})
    .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));

let lbSel=gLb.selectAll("text").data(nodes,d=>d.id).join("text")
  .attr("text-anchor","middle")
  .attr("dy",d=>nR(d)+9)
  .attr("fill",d=>d.id==="SOIL"?"#222":"#444")
  .attr("font-size",d=>d.id==="SOIL"?"11px":d.degree>4?"9.5px":"8px")
  .attr("font-weight",d=>d.id==="SOIL"?"700":"400")
  .attr("stroke","#f8f8f5").attr("stroke-width",2.5).attr("paint-order","stroke")
  .attr("pointer-events","none")
  .text(d=>d.id);

sim.on("tick",()=>{
  lkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
       .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  ndSel.attr("cx",d=>d.x).attr("cy",d=>d.y);
  lbSel.attr("x",d=>d.x).attr("y",d=>d.y);
});

// ═══════════════════════════════════════════════════════════
//  FILTER & HIGHLIGHT
// ═══════════════════════════════════════════════════════════
function updVis(){
  const vl=links.filter(l=>actT.has(l.type)&&
    actC.has(nMap[l.source.id||l.source]?.cat)&&
    actC.has(nMap[l.target.id||l.target]?.cat));
  const ci=new Set(["SOIL"]);
  vl.forEach(l=>{ci.add(l.source.id||l.source);ci.add(l.target.id||l.target);});
  lkSel.attr("display",d=>{
    if(!actT.has(d.type))return"none";
    if(!actC.has(nMap[d.source.id]?.cat))return"none";
    if(!actC.has(nMap[d.target.id]?.cat))return"none";
    return null;
  });
  ndSel.attr("display",d=>{
    if(!actC.has(d.cat))return"none";
    if(showConn&&!ci.has(d.id))return"none";
    return null;
  });
  lbSel.attr("display",d=>{
    if(!actC.has(d.cat))return"none";
    if(showConn&&!ci.has(d.id))return"none";
    return null;
  });
  updHL();updStats();
}

function updHL(){
  if(!selN&&!srch){
    lkSel.attr("stroke-opacity",.55);
    ndSel.attr("opacity",1);lbSel.attr("opacity",1);return;
  }
  const focus=new Set();
  if(selN){
    focus.add(selN);
    links.forEach(l=>{const s=l.source.id,t=l.target.id;
      if(s===selN||t===selN){focus.add(s);focus.add(t);}});
  }
  const sm=new Set();
  if(srch)nodes.forEach(n=>{if(n.id.toLowerCase().includes(srch))sm.add(n.id);});
  lkSel.attr("stroke-opacity",d=>{
    const s=d.source.id,t=d.target.id;
    if(selN&&focus.has(s)&&focus.has(t))return .9;
    if(selN)return .04;
    return .55;
  });
  ndSel.attr("opacity",d=>{
    if(srch&&!sm.has(d.id))return .08;
    if(selN&&!focus.has(d.id))return .08;
    return 1;
  });
  lbSel.attr("opacity",d=>{
    if(srch&&!sm.has(d.id))return 0;
    if(selN&&!focus.has(d.id))return .05;
    return 1;
  });
}

function updStats(){
  const vl=links.filter(l=>actT.has(l.type));
  const vn=nodes.filter(n=>actC.has(n.cat));
  const cx={};Object.keys(ET).forEach(k=>cx[k]=0);
  vl.forEach(l=>cx[l.type]++);
  const top=nodes.filter(n=>n.id!=="SOIL").sort((a,b)=>b.degree-a.degree)[0];
  document.getElementById("sta").innerHTML=
    `<div class="sr"><span>Plants showing</span><b>${vn.length}</b></div>`+
    `<div class="sr"><span>Relationships</span><b>${vl.length}</b></div>`+
    Object.entries(ET).map(([k,v])=>
      `<div class="sr"><span style="color:${v.c}">${v.l}</span><b>${cx[k]}</b></div>`).join("")+
    (top?`<div class="sr" style="margin-top:4px"><span>Most connected</span><b style="font-size:10px">${top.id} (${top.degree})</b></div>`:"");
}

// ═══════════════════════════════════════════════════════════
//  UI CONTROLS
// ═══════════════════════════════════════════════════════════
const efc=document.getElementById("ef-c");
Object.entries(ET).forEach(([k,v])=>{
  const cnt=links.filter(l=>l.type===k).length;
  const row=document.createElement("label");
  row.className="ef";
  const swStyle=v.dash
    ?`background:repeating-linear-gradient(90deg,${v.c} 0,${v.c} 6px,transparent 6px,transparent 9px)`
    :`background:${v.c}`;
  row.innerHTML=`<input type="checkbox" checked onchange="togT('${k}',this.checked)">
    <span class="sw" style="${swStyle}"></span>
    <span>${v.l}</span><span class="cnt">${cnt}</span>`;
  efc.appendChild(row);
});
function togT(k,on){if(on)actT.add(k);else actT.delete(k);updVis();}

const cgEl=document.getElementById("cg");
Object.entries(CAT).forEach(([k,v])=>{
  if(k==="HB")return;
  const el=document.createElement("span");
  el.className="cl";
  el.innerHTML=`<span class="cld" style="background:${v.c}"></span>${v.l}`;
  el.onclick=()=>{if(actC.has(k))actC.delete(k);else actC.add(k);el.classList.toggle("off",!actC.has(k));updVis();};
  cgEl.appendChild(el);
});

function doSearch(v){srch=v.trim().toLowerCase();updHL();}
function toggleConn(){showConn=!showConn;document.getElementById("btn-co").classList.toggle("on",showConn);document.getElementById("btn-co").textContent=showConn?"Show all nodes":"Hide isolated nodes";updVis();}

const CC2={
  CG:{x:.2,y:.15},LP:{x:.5,y:.1},VG:{x:.8,y:.15},HK:{x:.85,y:.45},
  FT:{x:.75,y:.75},AP:{x:.5,y:.9},MP:{x:.25,y:.85},IF:{x:.1,y:.7},
  FG:{x:.1,y:.4},ST:{x:.1,y:.15},TP:{x:.35,y:.55},WU:{x:.6,y:.5},
  AW:{x:.35,y:.3},SS:{x:.6,y:.25},HB:{x:.5,y:.5}
};
function toggleCluster(){
  clMode=!clMode;
  document.getElementById("btn-cl").classList.toggle("on",clMode);
  if(clMode){
    sim.force("cx",d3.forceX(d=>CC2[d.cat]?.x*W()||W()/2).strength(.2));
    sim.force("cy",d3.forceY(d=>CC2[d.cat]?.y*H()||H()/2).strength(.2));
  }else{sim.force("cx",null).force("cy",null);}
  sim.alpha(.5).restart();
}
function resetAll(){
  actT=new Set(Object.keys(ET));actC=new Set(Object.keys(CAT));
  showConn=false;srch="";selN=null;
  document.getElementById("srch").value="";
  document.getElementById("btn-co").classList.remove("on");
  document.getElementById("btn-co").textContent="Hide isolated nodes";
  document.querySelectorAll("#ef-c input").forEach(c=>c.checked=true);
  document.querySelectorAll(".cl").forEach(c=>c.classList.remove("off"));
  updVis();hideInfo();
}

// ═══════════════════════════════════════════════════════════
//  TOOLTIP
// ═══════════════════════════════════════════════════════════
function showTT(e,d){
  const tt=document.getElementById("tt");
  const cx={};Object.keys(ET).forEach(k=>cx[k]=0);
  d.linkData.forEach(l=>cx[l.type]++);
  const rel=Object.entries(cx).filter(([,v])=>v>0)
    .map(([k,v])=>`<span style="color:${ET[k].c}">${ET[k].l}: ${v}</span>`).join("<br>");
  tt.innerHTML=`<div class="tn">${d.id}</div><div class="tc">${CAT[d.cat]?.l||d.cat}</div>`+
    (d.degree?`<div class="tr" style="font-size:10.5px">${d.degree} link${d.degree!==1?'s':''}<br>${rel}</div>`:`<div class="tr" style="color:#bbb">No documented relationships</div>`);
  tt.style.display="block";moveTT(e);
}
function moveTT(e){
  const tt=document.getElementById("tt");
  const cv=document.getElementById("cv").getBoundingClientRect();
  let x=e.clientX-cv.left+12,y=e.clientY-cv.top-45;
  if(x+245>cv.width)x-=260;if(y<0)y+=75;
  tt.style.left=x+"px";tt.style.top=y+"px";
}
function hideTT(){document.getElementById("tt").style.display="none";}

// ═══════════════════════════════════════════════════════════
//  INFO PANEL
// ═══════════════════════════════════════════════════════════
function showInfo(d){
  const ip=document.getElementById("ip");
  if(d.id==="SOIL"){
    const rs=links.filter(l=>l.type==="R").map(l=>l.source.id||l.source);
    const es=links.filter(l=>l.type==="E").map(l=>l.source.id||l.source);
    ip.innerHTML=`<span class="ix" onclick="hideInfo()">✕</span>
      <div class="ih">SOIL</div>
      <div class="ic">Central fertility hub</div>
      <div class="is">Restores (${rs.length})</div>
      ${rs.map(n=>`<div class="il"><span class="idot" style="background:${ET.R.c}"></span>${n}</div>`).join("")}
      <div class="is">Exhausts (${es.length})</div>
      ${es.map(n=>`<div class="il"><span class="idot" style="background:${ET.E.c}"></span>${n}</div>`).join("")}`;
    ip.style.display="block";return;
  }
  const byt={};Object.keys(ET).forEach(k=>byt[k]=[]);
  links.forEach(l=>{
    const s=l.source.id||l.source,t=l.target.id||l.target;
    if(s===d.id)byt[l.type].push({other:t,note:l.note,dir:"→"});
    if(t===d.id)byt[l.type].push({other:s,note:l.note,dir:"←"});
  });
  const secs=Object.entries(ET).map(([k,v])=>{
    if(!byt[k].length)return"";
    return`<div class="is">${v.l} (${byt[k].length})</div>`+
      byt[k].map(r=>`<div class="il"><span class="idot" style="background:${v.c}"></span>
        <span><b>${r.dir==="→"?"→ ":"← "}${r.other}</b><br>
        <span style="font-size:10px;color:#aaa">${(r.note.split(" — ")[1]||"").replace(/, (Explicit|Strongly implied|Uncertain)$/,"")}</span></span></div>`).join("");
  }).join("");
  ip.innerHTML=`<span class="ix" onclick="hideInfo()">✕</span>
    <div class="ih">${d.id}</div>
    <div class="ic">${CAT[d.cat]?.l||d.cat} · ${d.degree} link${d.degree!==1?'s':''}</div>
    ${secs||'<div style="color:#bbb;font-size:11px">No documented relationships</div>'}`;
  ip.style.display="block";
}
function hideInfo(){document.getElementById("ip").style.display="none";}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
updVis();
const sn=nodes.find(n=>n.id==="SOIL");
if(sn){sn.x=W()/2;sn.y=H()/2;}
window.addEventListener("resize",()=>{
  sim.force("center",d3.forceCenter(W()/2,H()/2));
  sim.alpha(.1).restart();
});
</script>
</body>
</html>
