<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Islamic Golden Age Agronomy — Plant Relationship Network</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:system-ui,sans-serif;font-size:12px;background:#f8f8f5;color:#222}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:270px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid #e0dfd8;background:#fff;overflow:hidden}
#sidebar-header{padding:.75rem;border-bottom:1px solid #e0dfd8;flex-shrink:0}
#sidebar-header h1{font-size:13.5px;font-weight:700;color:#222;line-height:1.3}
#sidebar-header p{font-size:10px;color:#999;margin-top:2px}
#sidebar-body{overflow-y:auto;flex:1;padding:.75rem}
#canvas{flex:1;position:relative;overflow:hidden;background:#f8f8f5}
svg#net{width:100%;height:100%;display:block;cursor:grab}
svg#net:active{cursor:grabbing}

/* Search */
#search{width:100%;padding:6px 10px;font-size:12px;border:1px solid #d5d4cc;border-radius:6px;background:#fafaf7;color:#222;margin-bottom:.75rem}
#search:focus{outline:none;border-color:#777;background:#fff}

/* Section heading */
.sh{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#999;margin-bottom:.45rem}

/* Edge filter */
.ef-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;cursor:pointer;user-select:none;font-size:11.5px;color:#444}
.ef-row:hover{color:#111}
.ef-row input{width:13px;height:13px;flex-shrink:0;accent-color:#555;cursor:pointer}
.ef-swatch{width:24px;height:3px;flex-shrink:0;border-radius:2px}
.ef-count{margin-left:auto;font-size:10px;color:#aaa;font-weight:600}

/* Category legend */
.cat-grid{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:.5rem}
.cl{display:flex;align-items:center;gap:3px;font-size:10px;color:#555;padding:2px 5px;border-radius:4px;cursor:pointer;border:1px solid transparent}
.cl:hover{background:#f0f0ec}
.cl.off{opacity:.25}
.cl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Stats */
.stat-row{display:flex;justify-content:space-between;font-size:11px;color:#777;margin-bottom:3px}
.stat-row b{color:#333;font-weight:600}

/* Buttons */
.btn{width:100%;padding:6px 10px;font-size:11.5px;border:1px solid #d5d4cc;border-radius:6px;background:#f5f5f0;color:#555;cursor:pointer;margin-top:5px;text-align:left}
.btn:hover{background:#eee;color:#222}
.btn.on{background:#333;color:#fff;border-color:#333}

.divider{height:1px;background:#eeeee8;margin:.65rem 0}

/* Tooltip */
#tt{position:absolute;pointer-events:none;background:#fff;border:1px solid #d5d4cc;border-radius:8px;padding:8px 11px;font-size:11.5px;max-width:230px;line-height:1.55;box-shadow:0 3px 12px rgba(0,0,0,.1);display:none;z-index:200}
#tt .tn{font-weight:700;font-size:13px;color:#222;margin-bottom:2px}
#tt .tc{font-size:10px;color:#888;margin-bottom:5px}
#tt .tr{font-size:11px;color:#555}

/* Info panel */
#info{position:absolute;top:12px;right:12px;width:220px;max-height:calc(100vh - 24px);overflow-y:auto;background:#fff;border:1px solid #d5d4cc;border-radius:10px;padding:12px;font-size:11.5px;line-height:1.6;box-shadow:0 3px 16px rgba(0,0,0,.1);display:none;z-index:150}
#info .ih{font-weight:700;font-size:13px;color:#222;margin-bottom:1px}
#info .ic{font-size:10px;color:#999;margin-bottom:8px;border-bottom:1px solid #f0f0e8;padding-bottom:6px}
#info .il{display:flex;align-items:flex-start;gap:6px;margin-bottom:4px;font-size:11px;color:#444}
#info .idot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:3px}
#info .iclose{float:right;font-size:14px;color:#aaa;cursor:pointer;line-height:1;margin-left:6px}
#info .iclose:hover{color:#333}
#info .isec{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#bbb;margin:8px 0 4px}

/* SVG elements */
.link{stroke-linecap:round;transition:stroke-opacity .2s}
text.nlabel{font-family:system-ui,sans-serif;paint-order:stroke;stroke-linejoin:round;pointer-events:none;font-size:8.5px}
text.nlabel.hub-label{font-size:11px;font-weight:700;fill:#222;stroke:#f8f8f5;stroke-width:3}
circle.node{transition:r .15s}
</style>
</head>
<body>
<div id="app">
<aside id="sidebar">
  <div id="sidebar-header">
    <h1>Plant Relationship Network</h1>
    <p>Islamic Golden Age Agronomy · 248 plants · Ibn al-Awwam, Ibn Bassal, Ibn Wahshiyya</p>

    <div class="divider"></div>
    <div class="sh">Network stats</div>
    <div id="stats-area"></div>

    <div class="divider"></div>
    <button class="btn" id="btn-conn" onclick="toggleConnected()">Hide isolated nodes</button>
    <button class="btn" id="btn-clust" onclick="toggleCluster()">Cluster by category</button>
    <button class="btn" onclick="resetAll()">Reset all filters</button>
  </div>
</aside>
<main id="canvas">

    <g id="g-links"></g>
    <g id="g-nodes"></g>
    <g id="g-labels"></g>
  </svg>
  <div id="tt"></div>
  <div id="info"></div>
</main>
</div>

// ═══════════════════════════════════════════════════════════════════════
//  BUILD GRAPH DATA
// ═══════════════════════════════════════════════════════════════════════

const nodeMap = {};
RAW_NODES.forEach(([id, cat]) => {
  nodeMap[id] = { id, cat, links: [] };
});

const links = RAW_LINKS.map(([s, t, type, note]) => {
  const src = nodeMap[s], tgt = nodeMap[t];
  if (!src) { console.warn("Missing source:", s); return null; }
  if (!tgt) { console.warn("Missing target:", t); return null; }
  src.links.push({ to: t, type, note });
  tgt.links.push({ to: s, type, note });
  return { source: s, target: t, type, note };
}).filter(Boolean);

const nodes = RAW_NODES.map(([id, cat]) => ({
  id, cat,
  degree: nodeMap[id].links.length,
  linkData: nodeMap[id].links
}));

// ═══════════════════════════════════════════════════════════════════════
//  D3 SETUP
// ═══════════════════════════════════════════════════════════════════════

const svg = d3.select("#net");
const W = () => document.getElementById("canvas").clientWidth;
const H = () => document.getElementById("canvas").clientHeight;

// Markers
const defs = d3.select("#defs-markers");
Object.entries(ETYPE).forEach(([k, v]) => {
  defs.append("marker")
    .attr("id", "m-" + k)
    .attr("viewBox", "0 -4 10 8")
    .attr("refX", 22).attr("refY", 0)
    .attr("markerWidth", 5).attr("markerHeight", 5)
    .attr("orient", "auto")
    .append("path")
    .attr("d", "M0,-4L10,0L0,4")
    .attr("fill", v.c).attr("opacity", .75);
});

const gLinks = d3.select("#g-links");
const gNodes = d3.select("#g-nodes");
const gLabels = d3.select("#g-labels");

// State
let activeTypes = new Set(Object.keys(ETYPE));
let activeCats = new Set(Object.keys(CAT));
let showConnectedOnly = false;
let clusterMode = false;
let searchTerm = "";
let selectedNode = null;

// ─── Force simulation ──────────────────────────────────────────────────

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(d => {
    if (d.type === "R" || d.type === "E") return 160;
    if (d.type === "G") return 90;
    if (d.type === "S") return 110;
    return 100;
  }).strength(0.5))
  .force("charge", d3.forceManyBody().strength(d => {
    if (d.id === "SOIL") return -600;
    if (d.degree > 8) return -300;
    if (d.degree > 4) return -180;
    if (d.degree > 0) return -100;
    return -40;
  }))
  .force("center", d3.forceCenter(W() / 2, H() / 2))
  .force("collide", d3.forceCollide(d => nodeR(d) + 8))
  .alphaDecay(0.02)
  .velocityDecay(0.4);

// Cluster forces (inactive by default)
let clusterForceX = null, clusterForceY = null;

function nodeR(d) {
  if (d.id === "SOIL") return 14;
  if (d.degree === 0) return 3;
  return Math.min(4 + d.degree * 1.4, 14);
}

// ─── Zoom ──────────────────────────────────────────────────────────────

const zoom = d3.zoom().scaleExtent([0.1, 8]).on("zoom", e => {
  gLinks.attr("transform", e.transform);
  gNodes.attr("transform", e.transform);
  gLabels.attr("transform", e.transform);
});
svg.call(zoom);
svg.on("click", () => { selectedNode = null; updateHighlight(); hideInfo(); });

// ─── Render links ──────────────────────────────────────────────────────

let linkSel = gLinks.selectAll("line.link").data(links, d => d.source.id + d.target.id + d.type)
  .join("line")
  .attr("class", "link")
  .attr("stroke", d => ETYPE[d.type].c)
  .attr("stroke-width", d => ETYPE[d.type].w)
  .attr("stroke-dasharray", d => ETYPE[d.type].dash)
  .attr("stroke-opacity", 0.55)
  .attr("marker-end", d => `url(#m-${d.type})`);

// ─── Render nodes ──────────────────────────────────────────────────────

let nodeSel = gNodes.selectAll("circle.node").data(nodes, d => d.id)
  .join("circle")
  .attr("class", "node")
  .attr("r", d => nodeR(d))
  .attr("fill", d => CAT[d.cat]?.c || "#ccc")
  .attr("stroke", d => d.id === "SOIL" ? "#111" : "rgba(255,255,255,0.8)")
  .attr("stroke-width", d => d.id === "SOIL" ? 2 : 1.2)
  .attr("cursor", "pointer")
  .on("mouseenter", showTooltip)
  .on("mousemove", moveTooltip)
  .on("mouseleave", hideTooltip)
  .on("click", (e, d) => { e.stopPropagation(); selectedNode = d.id; updateHighlight(); showInfo(d); })
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end",   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

// ─── Render labels ─────────────────────────────────────────────────────

let labelSel = gLabels.selectAll("text.nlabel").data(nodes, d => d.id)
  .join("text")
  .attr("class", d => d.id === "SOIL" ? "nlabel hub-label" : "nlabel")
  .attr("text-anchor", "middle")
  .attr("dy", d => nodeR(d) + 9)
  .attr("fill", "#333")
  .attr("stroke", "#f8f8f5")
  .attr("stroke-width", 2.5)
  .attr("font-size", d => d.id === "SOIL" ? "11px" : d.degree > 4 ? "9.5px" : "8px")
  .text(d => d.id);

// ─── Simulation tick ───────────────────────────────────────────────────

sim.on("tick", () => {
  linkSel
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  nodeSel.attr("cx", d => d.x).attr("cy", d => d.y);
  labelSel.attr("x", d => d.x).attr("y", d => d.y);
});

// ═══════════════════════════════════════════════════════════════════════
//  FILTER & HIGHLIGHT
// ═══════════════════════════════════════════════════════════════════════

function updateVisibility() {
  const visibleLinks = links.filter(l =>
    activeTypes.has(l.type) &&
    activeCats.has(nodeMap[l.source.id || l.source]?.cat) &&
    activeCats.has(nodeMap[l.target.id || l.target]?.cat)
  );
  const connectedIds = new Set(["SOIL"]);
  visibleLinks.forEach(l => {
    connectedIds.add(l.source.id || l.source);
    connectedIds.add(l.target.id || l.target);
  });

  linkSel.attr("display", d => {
    const sid = d.source.id, tid = d.target.id;
    if (!activeTypes.has(d.type)) return "none";
    if (!activeCats.has(nodeMap[sid]?.cat)) return "none";
    if (!activeCats.has(nodeMap[tid]?.cat)) return "none";
    return null;
  });

  nodeSel.attr("display", d => {
    if (!activeCats.has(d.cat)) return "none";
    if (showConnectedOnly && !connectedIds.has(d.id)) return "none";
    return null;
  });

  labelSel.attr("display", d => {
    if (!activeCats.has(d.cat)) return "none";
    if (showConnectedOnly && !connectedIds.has(d.id)) return "none";
    return null;
  });

  updateHighlight();
  updateStats();
}

function updateHighlight() {
  if (!selectedNode && !searchTerm) {
    linkSel.attr("stroke-opacity", 0.55);
    nodeSel.attr("opacity", 1);
    labelSel.attr("opacity", 1);
    return;
  }

  const focus = new Set();
  if (selectedNode) {
    focus.add(selectedNode);
    links.forEach(l => {
      const s = l.source.id, t = l.target.id;
      if (s === selectedNode || t === selectedNode) { focus.add(s); focus.add(t); }
    });
  }

  const searchMatches = new Set();
  if (searchTerm) {
    nodes.forEach(n => {
      if (n.id.toLowerCase().includes(searchTerm)) searchMatches.add(n.id);
    });
  }

  linkSel.attr("stroke-opacity", d => {
    const s = d.source.id, t = d.target.id;
    if (selectedNode && (focus.has(s) && focus.has(t))) return 0.9;
    if (selectedNode) return 0.04;
    return 0.55;
  });

  nodeSel.attr("opacity", d => {
    if (searchTerm && !searchMatches.has(d.id)) return 0.08;
    if (selectedNode && !focus.has(d.id)) return 0.08;
    return 1;
  });

  labelSel.attr("opacity", d => {
    if (searchTerm && !searchMatches.has(d.id)) return 0;
    if (selectedNode && !focus.has(d.id)) return 0.05;
    return 1;
  });
}

function updateStats() {
  const visL = links.filter(l => activeTypes.has(l.type));
  const visN = nodes.filter(n => activeCats.has(n.cat));
  const counts = {};
  Object.keys(ETYPE).forEach(k => counts[k] = 0);
  visL.forEach(l => counts[l.type]++);
  document.getElementById("stats-area").innerHTML =
    `<div class="stat-row"><span>Plants shown</span><b>${visN.length}</b></div>` +
    `<div class="stat-row"><span>Total relationships</span><b>${visL.length}</b></div>` +
    Object.entries(ETYPE).map(([k,v]) =>
      `<div class="stat-row"><span style="color:${v.c}">${v.l}</span><b>${counts[k]}</b></div>`
    ).join("") +
    `<div class="stat-row" style="margin-top:4px"><span>Most connected</span><b style="font-size:10px">Garlic (${nodeMap["Garlic"]?.links.length})</b></div>`;
}

// Edge filter checkboxes
const efCont = document.getElementById("ef-container");
Object.entries(ETYPE).forEach(([k, v]) => {
  const cnt = links.filter(l => l.type === k).length;

    <span>${v.l}</span>
    <span class="ef-count">${cnt}</span>`;
  efCont.appendChild(row);
});

function toggleType(k, on) {
  if (on) activeTypes.add(k); else activeTypes.delete(k);
  updateVisibility();
}

// Category legend
const catGrid = document.getElementById("cat-grid");
Object.entries(CAT).forEach(([k, v]) => {
  if (k === "HB") return;
  const el = document.createElement("span");
  el.className = "cl";
  el.title = v.l;
  el.innerHTML = `<span class="cl-dot" style="background:${v.c}"></span>${v.l.replace(" & "," &\u00A0")}`;
  el.onclick = () => {
    if (activeCats.has(k)) activeCats.delete(k); else activeCats.add(k);
    el.classList.toggle("off", !activeCats.has(k));
    updateVisibility();
  };
  catGrid.appendChild(el);
});

function doSearch(v) {
  searchTerm = v.trim().toLowerCase();
  updateHighlight();
}

function toggleConnected() {
  showConnectedOnly = !showConnectedOnly;
  document.getElementById("btn-conn").classList.toggle("on", showConnectedOnly);
  document.getElementById("btn-conn").textContent = showConnectedOnly ? "Show all nodes" : "Hide isolated nodes";
  updateVisibility();
}

// Category centroids for cluster mode
const CAT_CENTROIDS = {
  CG:{x:0.2, y:0.15}, LP:{x:0.5, y:0.1},  VG:{x:0.8, y:0.15},
  HK:{x:0.85,y:0.45}, FT:{x:0.75,y:0.75}, AP:{x:0.5, y:0.9},
  MP:{x:0.25,y:0.85}, IF:{x:0.1, y:0.7},  FG:{x:0.1, y:0.4},
  ST:{x:0.1, y:0.15}, TP:{x:0.35,y:0.55}, WU:{x:0.6, y:0.5},
  AW:{x:0.35,y:0.3},  SS:{x:0.6, y:0.25}, HB:{x:0.5, y:0.5}
};

function toggleCluster() {
  clusterMode = !clusterMode;
  document.getElementById("btn-clust").classList.toggle("on", clusterMode);
  if (clusterMode) {
    sim.force("clusterX", d3.forceX(d => CAT_CENTROIDS[d.cat]?.x * W() || W()/2).strength(0.2));
    sim.force("clusterY", d3.forceY(d => CAT_CENTROIDS[d.cat]?.y * H() || H()/2).strength(0.2));
  } else {
    sim.force("clusterX", null).force("clusterY", null);
  }
  sim.alpha(0.5).restart();

function resetAll() {
  activeTypes = new Set(Object.keys(ETYPE));
  activeCats = new Set(Object.keys(CAT));
  showConnectedOnly = false;
  searchTerm = "";
  selectedNode = null;
  document.getElementById("search").value = "";
  document.getElementById("btn-conn").classList.remove("on");

  document.querySelectorAll(".cl").forEach(c => c.classList.remove("off"));

function resetView() {

}

// ═══════════════════════════════════════════════════════════════════════
//  TOOLTIP
// ═══════════════════════════════════════════════════════════════════════

function showTooltip(e, d) {
  const tt = document.getElementById("tt");
  const cnt = {};
  Object.keys(ETYPE).forEach(k => cnt[k] = 0);
  d.linkData.forEach(l => cnt[l.type]++);
  const rel = Object.entries(cnt).filter(([,v]) => v > 0)
    .map(([k,v]) => `<span style="color:${ETYPE[k].c}">${ETYPE[k].l}: ${v}</span>`).join(" · ");
  tt.innerHTML = `<div class="tn">${d.id}</div><div class="tc">${CAT[d.cat]?.l || d.cat}</div>` +
    (d.degree ? `<div class="tr">${d.degree} link${d.degree !== 1 ? 's' : ''} · ${rel}</div>` : `<div class="tr" style="color:#aaa">No documented relationships</div>`);
  tt.style.display = "block";
  moveTooltip(e);
}

function moveTooltip(e) {
  const tt = document.getElementById("tt");
  const cvs = document.getElementById("canvas").getBoundingClientRect();
  let x = e.clientX - cvs.left + 12, y = e.clientY - cvs.top - 40;
  if (x + 240 > cvs.width) x -= 260;
  if (y < 0) y += 70;
  tt.style.left = x + "px"; tt.style.top = y + "px";
}

function hideTooltip() { document.getElementById("tt").style.display = "none"; }

// ═══════════════════════════════════════════════════════════════════════
//  INFO PANEL
// ═══════════════════════════════════════════════════════════════════════

function showInfo(d) {
  const panel = document.getElementById("info");
  if (d.id === "SOIL") {
    panel.innerHTML = `<span class="iclose" onclick="hideInfo()">✕</span>
      <div class="ih">SOIL</div>
      <div class="ic">Central fertility hub · All restoration and exhaustion relationships</div>
      <div class="isec">Restores soil (${links.filter(l => l.type === "R").length} plants)</div>
      ${links.filter(l => l.type === "R").map(l => `<div class="il"><span class="idot" style="background:${ETYPE.R.c}"></span>${l.source.id || l.source}</div>`).join("")}
      <div class="isec">Exhausts soil (${links.filter(l => l.type === "E").length} plants)</div>
      ${links.filter(l => l.type === "E").map(l => `<div class="il"><span class="idot" style="background:${ETYPE.E.c}"></span>${l.source.id || l.source}</div>`).join("")}`;
    panel.style.display = "block"; return;
  }
  const byType = {};
  Object.keys(ETYPE).forEach(k => byType[k] = []);
  links.forEach(l => {
    const s = l.source.id || l.source, t = l.target.id || l.target;
    if (s === d.id) byType[l.type].push({ other: t, note: l.note, dir: "→" });
    if (t === d.id) byType[l.type].push({ other: s, note: l.note, dir: "←" });
  });
  const sections = Object.entries(ETYPE).map(([k, v]) => {
    if (!byType[k].length) return "";
    return `<div class="isec">${v.l} (${byType[k].length})</div>` +
      byType[k].map(r => `<div class="il"><span class="idot" style="background:${v.c}"></span>
        <span><b>${r.dir === "→" ? "→ " : "← "}${r.other}</b><br>
        <span style="font-size:10px;color:#999">${r.note.split(" — ")[1] || ""}</span></span></div>`).join("");
  }).join("");
  panel.innerHTML = `<span class="iclose" onclick="hideInfo()">✕</span>
    <div class="ih">${d.id}</div>
    <div class="ic">${CAT[d.cat]?.l || d.cat} · ${d.degree} relationship${d.degree !== 1 ? 's' : ''}</div>
    ${sections || '<div style="color:#aaa;font-size:11px">No documented relationships</div>'}`;
  panel.style.display = "block";
}

function hideInfo() {
  document.getElementById("info").style.display = "none";
}

// Center SOIL hub
const soilNode = nodes.find(n => n.id === "SOIL");
if (soilNode) { soilNode.x = W() / 2; soilNode.y = H() / 2; }

window.addEventListener("resize", () => {
  sim.force("center", d3.forceCenter(W() / 2, H() / 2));
  sim.alpha(0.1).restart();
});
</script>
