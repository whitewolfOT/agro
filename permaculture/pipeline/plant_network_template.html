<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Agronomy Network</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #0f1117;
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── Top bar ──────────────────────────────────────────────────────── */
#topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  height: 46px;
  min-height: 46px;
  background: #141720;
  border-bottom: 1px solid #252d3d;
  z-index: 10;
}
#topbar h1 { font-size: 13px; font-weight: 700; color: #a78bfa; white-space: nowrap; }
#search {
  max-width: 300px; flex: 1;
  background: #1e2130; border: 1px solid #2d3555; border-radius: 6px;
  color: #e2e8f0; padding: 5px 11px; font-size: 13px; outline: none;
  transition: border-color 0.15s;
}
#search:focus { border-color: #6366f1; }
#search::placeholder { color: #4b5563; }
#stats { margin-left: auto; font-size: 11px; color: #6b7280; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ── Layout ───────────────────────────────────────────────────────── */
#layout { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ──────────────────────────────────────────────────────── */
#sidebar {
  width: 240px; min-width: 240px;
  background: #141720; border-right: 1px solid #252d3d;
  overflow-y: auto; display: flex; flex-direction: column;
}
#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-track { background: transparent; }
#sidebar::-webkit-scrollbar-thumb { background: #2d3555; border-radius: 2px; }

.section { border-bottom: 1px solid #1e2130; padding: 11px 12px; }

.sec-title {
  font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: #6366f1; margin-bottom: 7px;
}

.sec-actions { display: flex; gap: 5px; margin-bottom: 8px; }
.sec-actions button {
  flex: 1; padding: 3px 0; font-size: 10px;
  background: #1a1d2b; border: 1px solid #2d3555; border-radius: 4px;
  color: #64748b; cursor: pointer; transition: all 0.12s;
}
.sec-actions button:hover { background: #252d3d; color: #e2e8f0; }

.cb-row {
  display: flex; align-items: center; gap: 7px;
  padding: 2px 0; cursor: pointer; user-select: none;
}
.cb-row input[type="checkbox"] {
  width: 12px; height: 12px; accent-color: #6366f1;
  flex-shrink: 0; cursor: pointer;
}
.cb-dot   { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.cb-swatch { width: 16px; height: 3px; border-radius: 2px; flex-shrink: 0; }
.cb-label { font-size: 11px; color: #64748b; }
.cb-row input:checked ~ .cb-label { color: #cbd5e1; }

.tog-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.tog-row input[type="checkbox"] { width: 12px; height: 12px; accent-color: #6366f1; cursor: pointer; flex-shrink: 0; }
.tog-row label { font-size: 11px; color: #64748b; cursor: pointer; }
.tog-row input:checked + label { color: #cbd5e1; }

/* ── Container ────────────────────────────────────────────────────── */
#container { flex: 1; position: relative; overflow: hidden; background: #0f1117; }

.node circle { cursor: pointer; }
.node text { pointer-events: none; fill: #94a3b8; text-anchor: middle; }

/* ── Tooltip ──────────────────────────────────────────────────────── */
#tooltip {
  position: absolute; background: #1a1d2b; border: 1px solid #2d3555;
  border-radius: 8px; padding: 10px 13px; font-size: 11px;
  pointer-events: none; max-width: 250px; display: none;
  box-shadow: 0 6px 20px rgba(0,0,0,0.6); z-index: 20;
}
#tooltip .tt-title { font-size: 12px; font-weight: 600; color: #a78bfa; margin-bottom: 6px; }
#tooltip .tt-row { display: flex; gap: 8px; margin-bottom: 2px; line-height: 1.45; }
#tooltip .tt-k { color: #4b5563; min-width: 64px; }
#tooltip .tt-v { color: #e2e8f0; }

/* ── Zoom controls ────────────────────────────────────────────────── */
#controls {
  position: absolute; bottom: 14px; right: 14px;
  display: flex; flex-direction: column; gap: 4px; z-index: 10;
}
#controls button {
  width: 28px; height: 28px; background: #1e2130cc;
  border: 1px solid #2d3555; border-radius: 5px;
  color: #e2e8f0; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px); transition: background 0.12s;
}
#controls button:hover { background: #2d3555; }
</style>
</head>
<body>

<div id="topbar">
  <h1>🌿 Plant Agronomy Network</h1>
  <input id="search" type="text" placeholder="Search plant…">
  <span id="stats"></span>
</div>

<div id="layout">

  <div id="sidebar">
    <div class="section">
      <div class="sec-title">Plant Form</div>
      <div class="sec-actions">
        <button id="forms-all">Select all</button>
        <button id="forms-none">Clear all</button>
      </div>
      <div id="form-list"></div>
    </div>

    <div class="section">
      <div class="sec-title">Relationship Type</div>
      <div class="sec-actions">
        <button id="types-all">Select all</button>
        <button id="types-none">Clear all</button>
      </div>
      <div id="type-list"></div>
    </div>

    <div class="section">
      <div class="sec-title">Display</div>
      <div id="display-toggles">
        <div class="tog-row"><input type="checkbox" id="tog-orphans"><label for="tog-orphans">Hide orphans</label></div>
        <div class="tog-row"><input type="checkbox" id="tog-cluster"><label for="tog-cluster">Group by form</label></div>
        <div class="tog-row"><input type="checkbox" id="tog-labels" checked><label for="tog-labels">Show labels</label></div>
      </div>
    </div>
  </div>

  <div id="container">
    <svg id="svg"></svg>
    <div id="tooltip"></div>
    <div id="controls">
      <button id="btn-zoom-in" title="Zoom in">+</button>
      <button id="btn-zoom-out" title="Zoom out">−</button>
      <button id="btn-reset" title="Reset">⟲</button>
    </div>
  </div>

</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const RAW_NODES = PLACEHOLDER_NODES;
const RAW_EDGES = PLACEHOLDER_EDGES;

// ── EDGE CONFIG ───────────────────────────────────────────────────────────────
const EDGE_CFG = {
  companion:     { color: "#4ade80", label: "Companion" },
  hostile:       { color: "#f87171", label: "Hostile" },
  nitrogen_fix:  { color: "#60a5fa", label: "N-fix" },
  mulch_biomass: { color: "#a3e635", label: "Mulch/Biomass" },
  soil_exhaust:  { color: "#fb923c", label: "Soil Exhaust" },
  succession:    { color: "#c084fc", label: "Succession" },
  water:         { color: "#38bdf8", label: "Water" },
  canopy_shade:  { color: "#fbbf24", label: "Canopy Shade" },
  animal:        { color: "#f472b6", label: "Animal" },
  grafting:      { color: "#94a3b8", label: "Grafting" },
  windbreak:     { color: "#86efac", label: "Windbreak" },
};

// ── FORM CONFIG ───────────────────────────────────────────────────────────────
const FORM_CFG = {
  canopy_tree:     { color: "#22d3ee", label: "Canopy Tree" },
  mid_tree:        { color: "#4ade80", label: "Mid Tree" },
  shrub:           { color: "#a3e635", label: "Shrub" },
  groundcover:     { color: "#fbbf24", label: "Groundcover" },
  climber:         { color: "#c084fc", label: "Climber" },
  grass_grain:     { color: "#f97316", label: "Grass/Grain" },
  aquatic_wetland: { color: "#38bdf8", label: "Aquatic/Wetland" },
  palm:            { color: "#d97706", label: "Palm" },
  succulent:       { color: "#0d9488", label: "Succulent" },
  null:            { color: "#6366f1", label: "Hub/Other" },
};

function nodeRadius(n) {
  if (n.kind === "hub")         return 18;
  if (n.form === "canopy_tree") return 14;
  if (n.form === "mid_tree")    return 11;
  if (n.form === "shrub")       return 9;
  if (n.form === "groundcover") return 7;
  return 8;
}
function nodeColor(n) { return (FORM_CFG[n.form || "null"] || FORM_CFG["null"]).color; }
function formKey(n)   { return n.form || "null"; }

// ── STATE ─────────────────────────────────────────────────────────────────────
const DATA_FORMS = [...new Set(RAW_NODES.map(n => n.form || "null"))].sort();
const DATA_TYPES = [...new Set(RAW_EDGES.map(e => e.type))].filter(t => EDGE_CFG[t]).sort();

let activeForms = new Set(DATA_FORMS);
let activeTypes = new Set(DATA_TYPES);
let hideOrphans = false;
let groupByForm = false;
let showLabels  = true;
let searchTerm  = "";

// ── SVG SETUP ─────────────────────────────────────────────────────────────────
const W = window.innerWidth - 240;
const H = window.innerHeight - 46;

const svg = d3.select("#svg").attr("width", W).attr("height", H);

const zoom = d3.zoom().scaleExtent([0.04, 10]).on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

const g = svg.append("g");

// Arrowhead markers per edge type
const defs = svg.append("defs");
Object.entries(EDGE_CFG).forEach(([type, cfg]) => {
  const m = defs.append("marker")
    .attr("id", `arr-${type}`)
    .attr("markerWidth", 6).attr("markerHeight", 6)
    .attr("refX", 6).attr("refY", 3)
    .attr("orient", "auto");
  m.append("path").attr("d", "M0,0 L0,6 L6,3 z")
    .attr("fill", cfg.color).attr("opacity", 0.8);
});

// ── SIMULATION ────────────────────────────────────────────────────────────────
const simulation = d3.forceSimulation(RAW_NODES)
  .force("link",    d3.forceLink(RAW_EDGES).id(d => d.id).distance(80).strength(0.3))
  .force("charge",  d3.forceManyBody().strength(-150).distanceMax(350))
  .force("center",  d3.forceCenter(W / 2, H / 2))
  .force("collide", d3.forceCollide(d => nodeRadius(d) + 3))
  .alphaDecay(0.02)
  .on("tick", ticked);

console.log("nodes:", RAW_NODES.length, "edges:", RAW_EDGES.length);

// ── GRAPH ELEMENTS ────────────────────────────────────────────────────────────
let linkVisSel, linkHitSel, nodeSel;

function buildGraph() {
  // Visual edges (no pointer events — hitbox layer handles those)
  linkVisSel = g.append("g").attr("class", "links")
    .selectAll("line")
    .data(RAW_EDGES)
    .join("line")
      .attr("stroke", d => (EDGE_CFG[d.type] || {color:"#555"}).color)
      .attr("stroke-width", d => Math.max(1, 1 + (d.confidence || 0.5)))
      .attr("stroke-opacity", 0.5)
      .attr("marker-end", d => d.direction !== "undirected" ? `url(#arr-${d.type})` : null)
      .style("pointer-events", "none");

  // Hitbox edges (transparent, wide, hover events)
  linkHitSel = g.append("g").attr("class", "link-hits")
    .selectAll("line")
    .data(RAW_EDGES)
    .join("line")
      .attr("stroke", "transparent")
      .attr("stroke-width", 10)
      .style("cursor", "pointer")
      .on("mouseover", showEdgeTip)
      .on("mousemove", moveTip)
      .on("mouseout",  hideTip);

  // Nodes
  nodeSel = g.append("g").attr("class", "nodes")
    .selectAll("g")
    .data(RAW_NODES)
    .join("g")
      .attr("class", "node")
      .call(d3.drag()
        .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on("end",   (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }))
      .on("mouseover", showNodeTip)
      .on("mousemove", moveTip)
      .on("mouseout",  hideTip);

  nodeSel.append("circle")
    .attr("r", nodeRadius)
    .attr("fill", nodeColor)
    .attr("stroke", d => nodeColor(d))
    .attr("stroke-width", 1.5)
    .attr("stroke-opacity", 0.5);

  nodeSel.append("text")
    .attr("dy", d => nodeRadius(d) + 10)
    .style("font-size", "10px")
    .text(d => d.id.length > 16 ? d.id.slice(0, 15) + "…" : d.id);
}

// ── TICK ──────────────────────────────────────────────────────────────────────
function ticked() {
  [linkVisSel, linkHitSel].forEach(sel => {
    if (!sel) return;
    sel.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
       .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  });
  if (nodeSel) nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
}

// ── CLUSTER FORCE ─────────────────────────────────────────────────────────────
const formCentroids = new Map();

function updateClusterForce() {
  if (groupByForm) {
    const cx = W / 2, cy = H / 2, r = Math.min(W, H) * 0.3;
    DATA_FORMS.forEach((f, i) => {
      const angle = (2 * Math.PI * i / DATA_FORMS.length) - Math.PI / 2;
      formCentroids.set(f, { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) });
    });
    simulation.force("cluster", alpha => {
      RAW_NODES.forEach(node => {
        const c = formCentroids.get(formKey(node));
        if (!c) return;
        node.vx += (c.x - node.x) * 0.18 * alpha;
        node.vy += (c.y - node.y) * 0.18 * alpha;
      });
    });
  } else {
    simulation.force("cluster", null);
  }
  simulation.alpha(0.5).restart();
}

// ── FILTERS ───────────────────────────────────────────────────────────────────
function nodeId(v) { return (typeof v === "object" && v !== null) ? v.id : v; }

function applyFilters() {
  if (!nodeSel || !linkVisSel) return;

  // 1. Nodes passing form filter
  const formPass = new Set(RAW_NODES.filter(n => activeForms.has(formKey(n))).map(n => n.id));

  // 2. Edge visibility: type filter + both endpoints in formPass
  const edgeVis = RAW_EDGES.map(e =>
    activeTypes.has(e.type) && formPass.has(nodeId(e.source)) && formPass.has(nodeId(e.target))
  );

  // 3. Orphan pruning: hide nodes with no visible edge
  let nodeVis = formPass;
  if (hideOrphans) {
    const connected = new Set();
    RAW_EDGES.forEach((e, i) => {
      if (edgeVis[i]) { connected.add(nodeId(e.source)); connected.add(nodeId(e.target)); }
    });
    nodeVis = new Set([...formPass].filter(id => connected.has(id)));
    // Re-check edges against pruned node set
    RAW_EDGES.forEach((e, i) => {
      if (edgeVis[i])
        edgeVis[i] = nodeVis.has(nodeId(e.source)) && nodeVis.has(nodeId(e.target));
    });
  }

  // 4. Search term → dim non-matching (does not hide)
  const q = searchTerm.toLowerCase();
  const matchIds = q
    ? new Set(RAW_NODES
        .filter(n => n.id.toLowerCase().includes(q) || (n.name_sci || "").toLowerCase().includes(q))
        .map(n => n.id))
    : null;

  // Apply node display + opacity
  nodeSel
    .style("display", d => nodeVis.has(d.id) ? null : "none")
    .style("opacity", d => {
      if (!nodeVis.has(d.id)) return null;
      return (matchIds && !matchIds.has(d.id)) ? 0.1 : null;
    });

  // Apply edge display + opacity
  linkVisSel
    .style("display",         (d, i) => edgeVis[i] ? null : "none")
    .attr("stroke-opacity",   (d, i) => {
      if (!edgeVis[i]) return null;
      if (matchIds) {
        const sid = nodeId(d.source), tid = nodeId(d.target);
        if (!matchIds.has(sid) && !matchIds.has(tid)) return 0.15;
      }
      return 0.5;
    });
  linkHitSel.style("display", (d, i) => edgeVis[i] ? null : "none");

  // Label visibility
  nodeSel.selectAll("text").style("display", showLabels ? null : "none");

  // Stats
  const visE = edgeVis.filter(Boolean).length;
  document.getElementById("stats").textContent = `${nodeVis.size} nodes · ${visE} edges`;
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function buildSidebar() {
  // Form checkboxes
  const fl = document.getElementById("form-list");
  DATA_FORMS.forEach(form => {
    const cfg = FORM_CFG[form] || FORM_CFG["null"];
    const lbl = document.createElement("label");
    lbl.className = "cb-row";
    lbl.innerHTML =
      `<input type="checkbox" data-form="${form}" checked>` +
      `<span class="cb-dot" style="background:${cfg.color}"></span>` +
      `<span class="cb-label">${cfg.label}</span>`;
    fl.appendChild(lbl);
    lbl.querySelector("input").addEventListener("change", e => {
      if (e.target.checked) activeForms.add(form); else activeForms.delete(form);
      applyFilters();
    });
  });

  // Type checkboxes
  const tl = document.getElementById("type-list");
  DATA_TYPES.forEach(type => {
    const cfg = EDGE_CFG[type]; if (!cfg) return;
    const lbl = document.createElement("label");
    lbl.className = "cb-row";
    lbl.innerHTML =
      `<input type="checkbox" data-type="${type}" checked>` +
      `<span class="cb-swatch" style="background:${cfg.color}"></span>` +
      `<span class="cb-label">${cfg.label}</span>`;
    tl.appendChild(lbl);
    lbl.querySelector("input").addEventListener("change", e => {
      if (e.target.checked) activeTypes.add(type); else activeTypes.delete(type);
      applyFilters();
    });
  });

  // Select all / clear all
  document.getElementById("forms-all").addEventListener("click", () => {
    activeForms = new Set(DATA_FORMS);
    document.querySelectorAll("[data-form]").forEach(cb => cb.checked = true);
    applyFilters();
  });
  document.getElementById("forms-none").addEventListener("click", () => {
    activeForms.clear();
    document.querySelectorAll("[data-form]").forEach(cb => cb.checked = false);
    applyFilters();
  });
  document.getElementById("types-all").addEventListener("click", () => {
    activeTypes = new Set(DATA_TYPES);
    document.querySelectorAll("[data-type]").forEach(cb => cb.checked = true);
    applyFilters();
  });
  document.getElementById("types-none").addEventListener("click", () => {
    activeTypes.clear();
    document.querySelectorAll("[data-type]").forEach(cb => cb.checked = false);
    applyFilters();
  });

  // Display toggles
  document.getElementById("tog-orphans").addEventListener("change", e => { hideOrphans = e.target.checked; applyFilters(); });
  document.getElementById("tog-cluster").addEventListener("change", e => { groupByForm = e.target.checked; updateClusterForce(); });
  document.getElementById("tog-labels").addEventListener("change", e => {
    showLabels = e.target.checked;
    if (nodeSel) nodeSel.selectAll("text").style("display", showLabels ? null : "none");
  });
}

// ── TOOLTIP ───────────────────────────────────────────────────────────────────
const ttEl = document.getElementById("tooltip");

function showNodeTip(e, d) {
  const deg = RAW_EDGES.filter(edge => nodeId(edge.source) === d.id || nodeId(edge.target) === d.id).length;
  ttEl.innerHTML =
    `<div class="tt-title">${d.id}</div>` +
    (d.name_sci ? `<div class="tt-row"><span class="tt-k">Species</span><span class="tt-v"><i>${d.name_sci}</i></span></div>` : "") +
    (d.name_ar  ? `<div class="tt-row"><span class="tt-k">Arabic</span><span class="tt-v">${d.name_ar}</span></div>` : "") +
    (d.form     ? `<div class="tt-row"><span class="tt-k">Form</span><span class="tt-v">${d.form.replace(/_/g," ")}</span></div>` : "") +
    (d.function?.length ? `<div class="tt-row"><span class="tt-k">Function</span><span class="tt-v">${d.function.join(", ")}</span></div>` : "") +
    (d.use?.length      ? `<div class="tt-row"><span class="tt-k">Use</span><span class="tt-v">${d.use.join(", ")}</span></div>` : "") +
    `<div class="tt-row"><span class="tt-k">Evidence</span><span class="tt-v">${d.evidence_level || "—"}</span></div>` +
    `<div class="tt-row"><span class="tt-k">Edges</span><span class="tt-v">${deg}</span></div>`;
  ttEl.style.display = "block";
  moveTip(e);
}

function showEdgeTip(e, d) {
  const src = nodeId(d.source), tgt = nodeId(d.target);
  const typeLabel = (EDGE_CFG[d.type] || {label: d.type}).label;
  const conf = typeof d.confidence === "number" ? (d.confidence * 100).toFixed(0) + "%" : "—";
  const quote = d.evidence_quote
    ? `<div class="tt-row"><span class="tt-k">Quote</span><span class="tt-v" style="font-style:italic;color:#94a3b8">"${d.evidence_quote.length > 110 ? d.evidence_quote.slice(0,110) + "…" : d.evidence_quote}"</span></div>`
    : "";
  ttEl.innerHTML =
    `<div class="tt-title" style="font-size:11px">${src} → ${tgt}</div>` +
    `<div class="tt-row"><span class="tt-k">Type</span><span class="tt-v">${typeLabel}</span></div>` +
    (d.origin ? `<div class="tt-row"><span class="tt-k">Origin</span><span class="tt-v">${d.origin}</span></div>` : "") +
    `<div class="tt-row"><span class="tt-k">Confidence</span><span class="tt-v">${conf}</span></div>` +
    (d.evidence_level ? `<div class="tt-row"><span class="tt-k">Evidence</span><span class="tt-v">${d.evidence_level}</span></div>` : "") +
    quote;
  ttEl.style.display = "block";
  moveTip(e);
}

function moveTip(e) {
  const cont = document.getElementById("container");
  const rect  = cont.getBoundingClientRect();
  let x = e.clientX - rect.left + 14;
  let y = e.clientY - rect.top  - 10;
  if (x + 260 > cont.clientWidth)  x = e.clientX - rect.left - 265;
  if (y + 200 > cont.clientHeight) y = e.clientY - rect.top  - 200;
  ttEl.style.left = x + "px";
  ttEl.style.top  = y + "px";
}
function hideTip() { ttEl.style.display = "none"; }

// ── ZOOM CONTROLS ─────────────────────────────────────────────────────────────
document.getElementById("btn-zoom-in").addEventListener("click",  () => svg.transition().duration(280).call(zoom.scaleBy, 1.5));
document.getElementById("btn-zoom-out").addEventListener("click", () => svg.transition().duration(280).call(zoom.scaleBy, 0.67));
document.getElementById("btn-reset").addEventListener("click",    () => svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity));

// ── SEARCH ────────────────────────────────────────────────────────────────────
document.getElementById("search").addEventListener("input", e => { searchTerm = e.target.value.trim(); applyFilters(); });

// ── INIT ──────────────────────────────────────────────────────────────────────
buildSidebar();
buildGraph();
setTimeout(() => applyFilters(), 500);
</script>
</body>
</html>
