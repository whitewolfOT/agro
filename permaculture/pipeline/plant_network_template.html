<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Plant Network</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:13px;background:#1a1a2e;color:#e0e0e0;display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
#sidebar{width:240px;min-width:240px;background:#16213e;border-right:1px solid #2a3560;overflow-y:auto;display:flex;flex-direction:column;gap:0;flex-shrink:0}
.sb-section{border-bottom:1px solid #2a3560;padding:8px 10px}
.sb-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#8899bb;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.sb-title button{font-size:10px;padding:1px 5px;background:#223;border:1px solid #445;border-radius:3px;color:#aac;cursor:pointer}
.sb-title button:hover{background:#334;color:#cce}

/* My Garden */
#garden-wrap{position:relative}
#garden-input{width:100%;padding:4px 6px;background:#0d1b2a;border:1px solid #2a3560;border-radius:4px;color:#e0e0e0;font-size:12px}
#garden-input:focus{outline:none;border-color:#4a7fc1}
#garden-dropdown{position:absolute;top:100%;left:0;right:0;background:#0d1b2a;border:1px solid #4a7fc1;border-top:none;border-radius:0 0 4px 4px;max-height:160px;overflow-y:auto;z-index:50;display:none}
#garden-dropdown div{padding:4px 8px;cursor:pointer;font-size:12px}
#garden-dropdown div:hover{background:#1a3a5c}
#garden-chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.chip{display:flex;align-items:center;gap:3px;background:#1a3a5c;border-radius:10px;padding:2px 7px;font-size:11px}
.chip-x{cursor:pointer;color:#88aacc;font-weight:700;line-height:1}
.chip-x:hover{color:#ff6666}
#btn-hide-incompat{width:100%;margin-top:5px;padding:4px;background:#1a3a5c;border:1px solid #2a5c9c;border-radius:4px;color:#88ccff;cursor:pointer;font-size:11px}
#btn-hide-incompat.active{background:#2a1a1a;border-color:#9c2a2a;color:#ff8888}
#btn-hide-incompat:hover{opacity:.85}
#btn-garden-focus{width:100%;margin-top:4px;padding:4px;background:#0d1b2a;border:1px solid #2a3560;border-radius:4px;color:#667;cursor:not-allowed;font-size:11px}
#btn-garden-focus:not(:disabled){background:#1a3050;border-color:#3a5080;color:#88aadd;cursor:pointer}
#btn-garden-focus.active{background:#1a3a5c;border-color:#4a8fc1;color:#aaddff}
#btn-garden-focus:not(:disabled):hover{opacity:.85}

/* Category grid */
#cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 4px}
.cat-row{display:flex;align-items:center;gap:4px;cursor:pointer;padding:2px 2px;border-radius:3px}
.cat-row:hover{background:#1a2a3a}
.cat-row input{margin:0;cursor:pointer}
.cat-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.cat-label{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.subcat-pills{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px;margin:2px 0 4px 16px}
.subcat-pill{font-size:10px;padding:1px 6px;border-radius:8px;border:1px solid #2a3560;cursor:pointer;background:#0d1b2a;color:#667}
.subcat-pill.active{border-color:#4a7fc1;background:#1a3a5c;color:#88ccff}

/* Water need pills */
#wn-pills{display:flex;flex-wrap:wrap;gap:4px}
.wn-pill{padding:3px 9px;border-radius:10px;border:1px solid #2a3560;cursor:pointer;font-size:11px}

/* Edge type checkboxes */
.edge-row{display:flex;align-items:center;gap:5px;padding:2px 0;cursor:pointer}
.edge-row input{cursor:pointer;margin:0}
.edge-swatch{width:12px;height:3px;border-radius:1px;flex-shrink:0}
.edge-abbr{font-size:10px;color:#667;background:#111;border-radius:2px;padding:0 3px;font-family:monospace}
.edge-label{font-size:11px}

/* Display toggles */
.toggle-row{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer}
.toggle-row input{cursor:pointer}
.toggle-row label{font-size:11px;cursor:pointer}
#cluster-btns{display:flex;gap:4px;margin-top:5px}
#cluster-btns button{flex:1;padding:4px 2px;font-size:11px;background:#1a2a3a;border:1px solid #2a4060;border-radius:4px;color:#aabbcc;cursor:pointer}
#cluster-btns button.active{background:#1a3a5c;border-color:#4a7fc1;color:#88ccff}
#cluster-btns button:hover{opacity:.85}

/* Stats */
#stats-body{font-size:11px;line-height:1.8;color:#99aacc}
#stats-body span{color:#e0e0e0;font-weight:600}
#stat-types{margin-top:4px}
.stat-type-row{display:flex;justify-content:space-between;font-size:10px}

/* ── Graph area ── */
#graph-area{flex:1;position:relative;overflow:hidden}
#svg{width:100%;height:100%;display:block}
#zoom-controls{position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;gap:4px}
#zoom-controls button{width:28px;height:28px;background:#16213e;border:1px solid #2a3560;border-radius:4px;color:#e0e0e0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
#zoom-controls button:hover{background:#1a3a5c}
#tooltip{position:absolute;background:rgba(10,20,40,.95);border:1px solid #4a7fc1;border-radius:5px;padding:7px 10px;font-size:11px;line-height:1.55;pointer-events:none;max-width:220px;display:none;z-index:40}

/* ── Info panel ── */
#info-panel{width:280px;min-width:280px;background:#16213e;border-left:1px solid #2a3560;overflow-y:auto;flex-shrink:0;display:none;flex-direction:column}
#info-panel.open{display:flex}
#info-header{padding:10px 12px;border-bottom:1px solid #2a3560;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
#info-name{font-size:15px;font-weight:700;color:#e8e8ff;flex:1}
#info-close{background:none;border:none;color:#667;font-size:18px;cursor:pointer;padding:0 2px;line-height:1}
#info-close:hover{color:#aaa}
#info-body{padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.info-field{font-size:11px}
.info-label{color:#8899bb;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.info-val{color:#e0e0e0}
.info-val.ar{direction:rtl;text-align:right;font-size:13px;color:#c0c8e0}
#info-cat-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600;margin-bottom:4px}
#info-edges-title{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#8899bb;margin-top:4px;margin-bottom:4px;border-top:1px solid #2a3560;padding-top:6px}
.info-edge-group{margin-bottom:6px}
.info-edge-type{font-size:10px;color:#8899bb;margin-bottom:2px;font-weight:600;display:flex;align-items:center;gap:4px}
.info-edge-type-swatch{width:20px;height:2px;display:inline-block;border-radius:1px}
.info-edge-item{font-size:11px;padding:2px 0 2px 8px;display:flex;align-items:center;gap:4px;cursor:pointer}
.info-edge-item:hover .info-edge-node{text-decoration:underline;color:#88ccff}
.info-edge-dir{color:#667;font-size:10px;width:14px;flex-shrink:0}
.info-edge-node{color:#c8d8ff}
.info-no-edges{font-size:11px;color:#667;font-style:italic}

/* scrollbars */
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0d1b2a}::-webkit-scrollbar-thumb{background:#2a3560;border-radius:3px}

/* node labels */
.node-label{font-size:9px;pointer-events:none;fill:#ccc;paint-order:stroke;stroke:#1a1a2e;stroke-width:2.5px}
.hub-label{font-size:11px;font-weight:700;fill:#FFD700;stroke:#1a1a2e;stroke-width:3px}
</style>
</head>
<body>

<!-- ══ SIDEBAR ══ -->
<div id="sidebar">

  <!-- My Garden -->
  <div class="sb-section">
    <div class="sb-title">My Garden</div>
    <div id="garden-wrap">
      <input id="garden-input" type="text" placeholder="Search or add a plant…" autocomplete="off"/>
      <div id="garden-dropdown"></div>
    </div>
    <div id="garden-chips"></div>
    <button id="btn-garden-focus" disabled>Focus: show related only</button>
    <button id="btn-hide-incompat">Hide incompatible plants</button>
  </div>

  <!-- Categories -->
  <div class="sb-section">
    <div class="sb-title">
      Categories
      <span>
        <button id="btn-cat-all">All</button>
        <button id="btn-cat-none">None</button>
      </span>
    </div>
    <div id="cat-grid"></div>
  </div>

  <!-- Water Needs -->
  <div class="sb-section">
    <div class="sb-title">Water Needs</div>
    <div id="wn-pills"></div>
  </div>

  <!-- Relationship Types -->
  <div class="sb-section">
    <div class="sb-title">
      Relationships
      <span>
        <button id="btn-edge-all">All</button>
        <button id="btn-edge-none">None</button>
      </span>
    </div>
    <div id="edge-list"></div>
  </div>

  <!-- Display -->
  <div class="sb-section">
    <div class="sb-title">Display</div>
    <div class="toggle-row">
      <input type="checkbox" id="chk-orphans"/>
      <label for="chk-orphans">Hide orphans</label>
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="chk-labels" checked/>
      <label for="chk-labels">Show labels</label>
    </div>
    <div id="cluster-btns">
      <button id="btn-cluster-cat">Cluster by category</button>
      <button id="btn-cluster-form">Cluster by form</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="sb-section">
    <div class="sb-title">Stats</div>
    <div id="stats-body">
      <div>Nodes: <span id="stat-nodes">—</span></div>
      <div>Edges: <span id="stat-edges">—</span></div>
      <div>Top plant: <span id="stat-top">—</span></div>
      <div id="stat-types"></div>
    </div>
  </div>

</div><!-- /sidebar -->

<!-- ══ GRAPH ══ -->
<div id="graph-area">
  <svg id="svg"></svg>
  <div id="zoom-controls">
    <button id="zoom-in">+</button>
    <button id="zoom-out">−</button>
    <button id="zoom-reset">⌂</button>
  </div>
  <div id="tooltip"></div>
</div>

<!-- ══ INFO PANEL ══ -->
<div id="info-panel">
  <div id="info-header">
    <div id="info-name">—</div>
    <button id="info-close">✕</button>
  </div>
  <div id="info-body"></div>
</div>

<script>
// ── Data (injected by build_final.py) ──
const RAW_NODES = PLACEHOLDER_NODES;
const RAW_EDGES = PLACEHOLDER_EDGES;

// ── Category config ──
const CAT_CFG = {
  CG:{l:"Cereals & grains",     c:"#7EB53A"},
  LP:{l:"Legumes & pulses",     c:"#18A070"},
  VG:{l:"Vegetables",           c:"#4A9FDC"},
  HK:{l:"Herbs & kitchen",      c:"#1870A0"},
  FT:{l:"Fruit trees",          c:"#E8920A"},
  AP:{l:"Aromatics & perfume",  c:"#C84070"},
  MP:{l:"Medicinal plants",     c:"#7060CC"},
  IF:{l:"Industrial & fiber",   c:"#888880"},
  FG:{l:"Fodder & green manure",c:"#4A8010"},
  ST:{l:"Structural trees",     c:"#605850"},
  TP:{l:"Toxic & pest-control", c:"#CC3030"},
  WU:{l:"Wild & utility",       c:"#B07818"},
  AW:{l:"Aquatic & wetland",    c:"#0848A0"},
  SS:{l:"Shrubs",               c:"#A09888"},
  HB:{l:"Hubs",                 c:"#FFD700"},
  AN:{l:"Animals & insects",    c:"#E91E63"},
};

// ── Edge config ──
const EDGE_CFG = {
  companion:    {color:"#4caf50",label:"Companion",       abbr:"F"},
  hostile:      {color:"#f44336",label:"Hostile",         abbr:"H"},
  nitrogen_fix: {color:"#00bcd4",label:"Nitrogen fix",    abbr:"Ro"},
  mulch_biomass:{color:"#8bc34a",label:"Mulch / biomass", abbr:"R"},
  soil_exhaust: {color:"#ff5722",label:"Soil exhaust",    abbr:"E"},
  grafting:     {color:"#9c27b0",label:"Grafting",        abbr:"G"},
  succession:   {color:"#ff9800",label:"Succession",      abbr:"S"},
  windbreak:    {color:"#607d8b",label:"Windbreak",       abbr:"P"},
  water:        {color:"#2196f3",label:"Water",           abbr:"W"},
  canopy_shade: {color:"#795548",label:"Canopy shade",    abbr:"C"},
  animal:       {color:"#e91e63",label:"Animal",          abbr:"A"},
};

// ── Sub-category membership ──
const SUBCAT = {
  FT:{
    "Stone fruit":    ["Peach","Apricot","Plum","Damson","Cherry","Olive","Almond"],
    "Pome fruit":     ["Apple","Pear","Quince","Medlar","Hawthorn","Loquat"],
    "Citrus":         ["Lemon","Citron","Sour orange","Sweet orange","Lime","Orange"],
    "Fig & mulberry": ["Fig","Mulberry","Sycamore fig","Black mulberry","White mulberry"],
    "Nuts & palms":   ["Walnut","Hazel","Pistachio","Date palm","Doum palm","Carob","Arbutus"],
    "Other":          [],
  },
  VG:{
    "Alliums":   ["Onion","Garlic","Leek","Shallot","Chive"],
    "Brassicas": ["Cabbage","Cauliflower","Kohlrabi","Radish","Turnip","Rocket","Watercress"],
    "Roots":     ["Carrot","Parsnip","Beetroot","Celery root","Salsify","Scorzonera"],
    "Leafy":     ["Lettuce","Spinach","Chard","Chicory","Endive","Mallow","Sorrel","Purslane","Borage"],
    "Fruiting":  ["Cucumber","Eggplant","Melon","Watermelon","Gourd","Bottle gourd","Tomato","Pepper"],
    "Other":     [],
  },
  HK:{
    "Aromatic":      ["Basil","Mint","Lemon balm","Sage","Thyme","Rosemary","Lavender","Marjoram","Oregano","Savory","Tarragon"],
    "Seed spices":   ["Coriander","Dill","Fennel","Fenugreek","Cumin","Caraway","Sesame","Anise","Mustard"],
    "Other culinary":["Parsley","Celery","Lovage","Hyssop","Chervil","Nasturtium"],
  },
  MP:{
    "Sedative":     ["Valerian","Henbane","Opium poppy","Chamomile","Passionflower","Hops"],
    "Digestive":    ["Gentian","Artichoke","Licorice","Senna","Aloe","Rhubarb"],
    "Antimicrobial":["Wormwood","Rue","Garlic","Thyme","Oregano","Sage","Tea tree"],
    "Topical":      ["Aloe","Comfrey","Calendula","Plantain","St John's Wort","Marigold"],
  },
};
// reverse lookup: nodeId → {cat, sub}
const SUBCAT_LOOKUP = {};
for(const [cat, subs] of Object.entries(SUBCAT)){
  for(const [sub, ids] of Object.entries(subs)){
    for(const id of ids) SUBCAT_LOOKUP[id]={cat,sub};
  }
}

// ── Assign category ──
function assignCat(n){
  if(n.kind==='hub')    return 'HB';
  if(n.kind==='animal') return 'AN';
  const f=n.form, u=n.use||[], fn=n.function||[];
  if(f==='aquatic_wetland')                                    return 'AW';
  if(u.includes('fiber_industrial') && !u.includes('food'))   return 'IF';
  if(f==='grass_grain')                                        return 'CG';
  if(fn.includes('nitrogen_fixer') && u.includes('food'))     return 'LP';
  if(fn.includes('nitrogen_fixer') && !u.includes('food'))    return 'FG';
  if(u.includes('fodder') && !u.includes('food'))             return 'FG';
  if((f==='canopy_tree'||f==='mid_tree') && u.includes('food')) return 'FT';
  if(f==='canopy_tree'||f==='mid_tree')                        return 'ST';
  if(u.includes('aromatic') && !u.includes('food'))           return 'AP';
  if(u.includes('medicinal') && !u.includes('food'))          return 'MP';
  if(u.includes('food') && u.includes('aromatic'))            return 'HK';
  if(u.includes('food') && (f==='groundcover'||f==='climber')) return 'VG';
  if(u.includes('food'))                                       return 'VG';
  if(fn.includes('pest_deterrent')||fn.includes('allelopath')) return 'TP';
  if(f==='shrub')                                              return 'SS';
  return 'WU';
}

// ── Node radius ──
function nodeRadius(n){
  if(n.kind==='hub')    return 20;
  if(n.kind==='animal') return 11;
  const r={canopy_tree:14,mid_tree:11,shrub:9,groundcover:7};
  return r[n.form]||8;
}

// ── sid/tid helpers (D3 mutates edge.source/target to objects after simulation) ──
const sid = e => (typeof e.source==='object' ? e.source.id : e.source);
const tid = e => (typeof e.target==='object' ? e.target.id : e.target);

// ── Assign cats ──
RAW_NODES.forEach(n => { n._cat = assignCat(n); });

// ── Indexes ──
const nodeById = {};
RAW_NODES.forEach(n => { nodeById[n.id] = n; });

// ── State ──
let activeCats     = new Set(Object.keys(CAT_CFG));
let excludedSubcats= {};   // {cat: Set<excluded sub names>} — empty = no subcat filter
let activeWater    = new Set(["low","medium","high","very_high"]);
let activeEdges    = new Set(Object.keys(EDGE_CFG));
let gardenSet      = new Set();
let gardenFocus    = false;
let hideIncompat   = false;
let hideOrphans    = false;
let showLabels     = true;
let clusterMode    = null;  // null | 'cat' | 'form'
let simulation, zoom, gAll, linkVisSel, linkHitSel, nodeSel, labelSel, hubLabelSel;
let selectedNodeId = null;

// ── Build sidebar ──
buildCatGrid();
buildWaterPills();
buildEdgeList();
initGarden();

function buildCatGrid(){
  const grid = document.getElementById('cat-grid');
  const catOrder = ['CG','LP','VG','HK','FT','AP','MP','IF','FG','ST','TP','WU','AW','SS','HB','AN'];
  const subCatHas = ['FT','VG','HK','MP'];
  catOrder.forEach(code => {
    const cfg = CAT_CFG[code];
    const row = document.createElement('div');
    row.className='cat-row'; row.dataset.cat=code;
    const chk = document.createElement('input');
    chk.type='checkbox'; chk.checked=true; chk.dataset.cat=code;
    chk.addEventListener('change', () => toggleCat(code, chk.checked));
    const sw = document.createElement('div');
    sw.className='cat-swatch'; sw.style.background=cfg.c;
    const lbl = document.createElement('div');
    lbl.className='cat-label'; lbl.textContent=cfg.l; lbl.title=cfg.l;
    row.appendChild(chk); row.appendChild(sw); row.appendChild(lbl);
    row.addEventListener('click', e => { if(e.target!==chk){ chk.checked=!chk.checked; toggleCat(code, chk.checked); }});
    grid.appendChild(row);

    if(subCatHas.includes(code)){
      const pillWrap = document.createElement('div');
      pillWrap.className='subcat-pills'; pillWrap.dataset.cat=code;
      Object.keys(SUBCAT[code]).forEach(sub => {
        const pill = document.createElement('div');
        pill.className='subcat-pill active';
        pill.textContent=sub; pill.dataset.cat=code; pill.dataset.sub=sub;
        pill.addEventListener('click', () => toggleSubcat(code, sub, pill));
        pillWrap.appendChild(pill);
      });
      grid.appendChild(pillWrap);
    }
  });

  document.getElementById('btn-cat-all').addEventListener('click',()=>{
    activeCats=new Set(Object.keys(CAT_CFG));
    excludedSubcats={};
    grid.querySelectorAll('input[data-cat]').forEach(c=>c.checked=true);
    grid.querySelectorAll('.subcat-pill').forEach(p=>p.classList.add('active'));
    applyFilters();
  });
  document.getElementById('btn-cat-none').addEventListener('click',()=>{
    activeCats=new Set();
    grid.querySelectorAll('input[data-cat]').forEach(c=>c.checked=false);
    applyFilters();
  });
}

function toggleCat(code, on){
  if(on) activeCats.add(code); else activeCats.delete(code);
  applyFilters();
}

// excludedSubcats[code] = Set of sub-names that are HIDDEN.
// Empty / absent = no sub-filter (show all in that cat).
function toggleSubcat(code, sub, pill){
  if(!excludedSubcats[code]) excludedSubcats[code]=new Set();
  const s=excludedSubcats[code];
  if(s.has(sub)){
    s.delete(sub); pill.classList.add('active');    // was hidden → now shown
  } else {
    s.add(sub);    pill.classList.remove('active'); // was shown → now hidden
  }
  if(s.size===0) delete excludedSubcats[code];
  applyFilters();
}

function buildWaterPills(){
  const wrap=document.getElementById('wn-pills');
  const wns=[
    {id:'low',      label:'Low',       color:'#c8a000'},
    {id:'medium',   label:'Medium',    color:'#4a9fdc'},
    {id:'high',     label:'High',      color:'#1870a0'},
    {id:'very_high',label:'Very High', color:'#0848a0'},
  ];
  wns.forEach(wn=>{
    const pill=document.createElement('div');
    pill.className='wn-pill';
    pill.textContent=wn.label; pill.dataset.wn=wn.id;
    pill.style.borderColor=wn.color;
    pill.style.background=wn.color; pill.style.color='#000';
    pill.addEventListener('click',()=>{
      if(activeWater.has(wn.id)){
        activeWater.delete(wn.id);
        pill.style.background='transparent'; pill.style.color=wn.color;
      } else {
        activeWater.add(wn.id);
        pill.style.background=wn.color; pill.style.color='#000';
      }
      applyFilters();
    });
    wrap.appendChild(pill);
  });
}

function buildEdgeList(){
  const wrap=document.getElementById('edge-list');
  Object.entries(EDGE_CFG).forEach(([k,cfg])=>{
    const row=document.createElement('div'); row.className='edge-row';
    const chk=document.createElement('input'); chk.type='checkbox'; chk.checked=true; chk.dataset.edge=k;
    chk.addEventListener('change',()=>{ if(chk.checked) activeEdges.add(k); else activeEdges.delete(k); applyFilters(); });
    const sw=document.createElement('div'); sw.className='edge-swatch'; sw.style.background=cfg.color;
    const abbr=document.createElement('div'); abbr.className='edge-abbr'; abbr.textContent=cfg.abbr;
    const lbl=document.createElement('div'); lbl.className='edge-label'; lbl.textContent=cfg.label;
    row.appendChild(chk); row.appendChild(sw); row.appendChild(abbr); row.appendChild(lbl);
    row.addEventListener('click',e=>{ if(e.target!==chk){ chk.checked=!chk.checked; if(chk.checked) activeEdges.add(k); else activeEdges.delete(k); applyFilters(); }});
    wrap.appendChild(row);
  });
  document.getElementById('btn-edge-all').addEventListener('click',()=>{
    activeEdges=new Set(Object.keys(EDGE_CFG));
    wrap.querySelectorAll('input').forEach(c=>c.checked=true); applyFilters();
  });
  document.getElementById('btn-edge-none').addEventListener('click',()=>{
    activeEdges=new Set();
    wrap.querySelectorAll('input').forEach(c=>c.checked=false); applyFilters();
  });
}

function initGarden(){
  const inp    = document.getElementById('garden-input');
  const dd     = document.getElementById('garden-dropdown');
  const chips  = document.getElementById('garden-chips');
  const btnInc = document.getElementById('btn-hide-incompat');
  const btnFoc = document.getElementById('btn-garden-focus');

  // ── Garden input: dropdown only, NO graph-related side effects ──
  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    dd.innerHTML = '';
    if(!q){ dd.style.display='none'; return; }
    const matches = RAW_NODES
      .filter(n => n.kind!=='hub' && n.kind!=='animal' && n.id.toLowerCase().includes(q))
      .slice(0, 12);
    if(!matches.length){ dd.style.display='none'; return; }
    matches.forEach(n => {
      const item = document.createElement('div');
      item.dataset.id  = n.id;   // exact node ID stored here
      item.textContent = n.id;
      item.addEventListener('click', () => {
        const id = item.dataset.id;
        if(!id || !nodeById[id]) return;
        addToGarden(id);
        inp.value = '';
        dd.style.display = 'none';
      });
      dd.appendChild(item);
    });
    dd.style.display = 'block';
  });

  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      const first = dd.querySelector('div');
      if(first){
        const id = first.dataset.id;
        if(id && nodeById[id]){ addToGarden(id); inp.value=''; dd.style.display='none'; }
      }
    }
    if(e.key === 'Escape') dd.style.display = 'none';
  });
  inp.addEventListener('blur', () => { setTimeout(() => { dd.style.display='none'; }, 150); });
  document.addEventListener('click', e => {
    if(!document.getElementById('garden-wrap').contains(e.target)) dd.style.display='none';
  });

  // ── Incompatibility toggle ──
  btnInc.addEventListener('click', () => {
    hideIncompat = !hideIncompat;
    btnInc.classList.toggle('active', hideIncompat);
    btnInc.textContent = hideIncompat ? 'Show all plants' : 'Hide incompatible plants';
    applyFilters();
  });

  // ── Garden focus toggle ──
  btnFoc.addEventListener('click', () => {
    if(!gardenSet.size) return;
    gardenFocus = !gardenFocus;
    btnFoc.classList.toggle('active', gardenFocus);
    btnFoc.textContent = gardenFocus ? 'Focus: ON — show related' : 'Focus: show related only';
    applyFilters();
  });

  function updateFocusBtn(){
    const empty = gardenSet.size === 0;
    btnFoc.disabled = empty;
    if(empty){
      gardenFocus = false;
      btnFoc.classList.remove('active');
      btnFoc.textContent = 'Focus: show related only';
    }
  }

  function addToGarden(id){
    if(!id || !nodeById[id] || gardenSet.has(id)) return;
    gardenSet.add(id);
    const chip = document.createElement('div'); chip.className='chip';
    const name = document.createElement('span'); name.textContent=id;
    const x    = document.createElement('span'); x.className='chip-x'; x.textContent='×';
    x.addEventListener('click', () => {
      gardenSet.delete(id);
      chip.remove();
      updateFocusBtn();
      applyFilters();
    });
    chip.appendChild(name); chip.appendChild(x);
    chips.appendChild(chip);
    updateFocusBtn();
    applyFilters();
  }
}

document.getElementById('chk-labels').addEventListener('change',e=>{

document.getElementById('btn-cluster-cat').addEventListener('click',()=>toggleCluster('cat'));
document.getElementById('btn-cluster-form').addEventListener('click',()=>toggleCluster('form'));

function toggleCluster(mode){
  clusterMode=(clusterMode===mode) ? null : mode;
  document.getElementById('btn-cluster-cat').classList.toggle('active',  clusterMode==='cat');
  document.getElementById('btn-cluster-form').classList.toggle('active', clusterMode==='form');
  if(!simulation) return;

  // Update collision radius
  simulation.force('collide').radius(d => clusterMode ? nodeRadius(d)*2.4 : nodeRadius(d)+4);

  // Update link distance
  simulation.force('link').distance(e=>{
    if(!clusterMode){
      const sh=nodeById[sid(e)]?.kind==='hub', th=nodeById[tid(e)]?.kind==='hub';
      return (sh&&th)?200:(sh||th)?150:80;
    }
    const sc=clusterMode==='cat' ? nodeById[sid(e)]?._cat : nodeById[sid(e)]?.form;
    const tc=clusterMode==='cat' ? nodeById[tid(e)]?._cat : nodeById[tid(e)]?.form;
    return sc===tc ? 55 : 150;
  });

  if(clusterMode){
    simulation.alphaTarget(0.09).alphaDecay(0.025).restart();
    setTimeout(()=>simulation.alphaTarget(0), 2800);
  } else {
    // Cluster off: reset to rest immediately
    simulation.alphaTarget(0).alphaDecay(0.02).restart();
  }
}

function openInfoPanel(nodeId){
  const n=nodeById[nodeId];
  if(!n) return;
  selectedNodeId=nodeId;

  if(nodeSel){
    nodeSel.attr('stroke', d => d.id===nodeId ? '#fff' : (d.kind==='hub'?'#FFD700':'#000'))
           .attr('stroke-width', d => d.id===nodeId ? 3.5 : (d.kind==='hub'?3:1.5));
  }

  document.getElementById('info-panel').classList.add('open');
  document.getElementById('info-name').textContent=n.id;

  const body=document.getElementById('info-body');
  body.innerHTML='';

  const cat=CAT_CFG[n._cat];
  const badge=document.createElement('div'); badge.id='info-cat-badge';
  badge.textContent=cat.l; badge.style.background=cat.c; badge.style.color='#000';
  body.appendChild(badge);

  const fields=[
    ['Scientific name', n.name_sci||'—', false],
    ['Arabic name',     n.name_ar||'—',  true],
    ['Form',            n.form||'—',     false],
    ['Water need',      (n.water_need||'medium').replace(/_/g,' '), false],
    ['Evidence',        n.evidence_level||'—', false],
    ['Sources',         (n.sources||[]).join(', ')||'—', false],
  ];
  if(n.notes) fields.push(['Notes', n.notes, false]);
  fields.forEach(([l,v,ar])=>{
    const wrap=document.createElement('div'); wrap.className='info-field';
    const ll=document.createElement('div'); ll.className='info-label'; ll.textContent=l;
    const vv=document.createElement('div'); vv.className='info-val'+(ar?' ar':''); vv.textContent=v;
    wrap.appendChild(ll); wrap.appendChild(vv); body.appendChild(wrap);
  });

  const edgesTitle=document.createElement('div'); edgesTitle.id='info-edges-title';
  edgesTitle.textContent='Relationships'; body.appendChild(edgesTitle);

  const nodeEdges=RAW_EDGES.filter(e=>{ const s=sid(e),t=tid(e); return s===nodeId||t===nodeId; });
  if(!nodeEdges.length){
    const empty=document.createElement('div'); empty.className='info-no-edges';
    empty.textContent='No relationships'; body.appendChild(empty); return;
  }

  const byType={};
  nodeEdges.forEach(e=>{ const k=e.type||'unknown'; if(!byType[k]) byType[k]=[]; byType[k].push(e); });

  Object.entries(byType).forEach(([type,edges])=>{
    const ecfg=EDGE_CFG[type];
    const group=document.createElement('div'); group.className='info-edge-group';
    const typeRow=document.createElement('div'); typeRow.className='info-edge-type';
    const sw=document.createElement('span'); sw.className='info-edge-type-swatch';
    sw.style.background=ecfg?ecfg.color:'#888';
    typeRow.appendChild(sw);
    typeRow.appendChild(document.createTextNode(ecfg?ecfg.label:type));
    group.appendChild(typeRow);
    edges.forEach(e=>{
      const s=sid(e), t=tid(e);
      const other=(s===nodeId)?t:s;
      const isOut=(s===nodeId);
      const item=document.createElement('div'); item.className='info-edge-item';
      const dirSpan=document.createElement('span'); dirSpan.className='info-edge-dir';
      dirSpan.textContent=e.direction==='undirected'?'↔':(isOut?'→':'←');
      const nameSpan=document.createElement('span'); nameSpan.className='info-edge-node';
      nameSpan.textContent=other;
      item.appendChild(dirSpan); item.appendChild(nameSpan);
      // Navigate to clicked node (item 6: wired)
      item.addEventListener('click',()=>{ if(nodeById[other]) openInfoPanel(other); });
      group.appendChild(item);
    });
    body.appendChild(group);
  });
}

// ── Main D3 init ──
(function init(){
  const W=document.getElementById('graph-area').clientWidth;
  const H=document.getElementById('graph-area').clientHeight;

  const svg=d3.select('#svg').attr('width',W).attr('height',H);

  zoom=d3.zoom().scaleExtent([0.05,8]).on('zoom',e=>{gAll.attr('transform',e.transform);});
  svg.call(zoom);
  svg.on('click',e=>{ if(e.target.tagName==='svg'||e.target.tagName==='rect') closeInfoPanel(); });

  gAll=svg.append('g');

  // Arrowhead markers
  const defs=svg.append('defs');
  Object.entries(EDGE_CFG).forEach(([k,cfg])=>{
    defs.append('marker').attr('id','arrow-'+k)
      .attr('viewBox','0 -4 8 8').attr('refX',8).attr('refY',0)
      .attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
      .append('path').attr('d','M0,-4L8,0L0,4').attr('fill',cfg.color).attr('opacity',0.7);
  });

  // Edge layers
  const gLinks=gAll.append('g').attr('class','links');
  linkVisSel=gLinks.append('g').selectAll('line').data(RAW_EDGES).join('line')
    .attr('class','link-vis')
    .attr('stroke',e=>(EDGE_CFG[e.type]||{color:'#888'}).color)
    .attr('stroke-opacity',e=>e.flags&&e.flags.includes('FACTCHECK_FLAGGED')?0.2:0.65)
    .attr('stroke-width',1.5)
    .attr('stroke-dasharray',e=>e.added?'5,3':null)
    .attr('marker-end',e=>e.direction!=='undirected'?`url(#arrow-${e.type})`:null)
    .style('pointer-events','none');

  linkHitSel=gLinks.append('g').selectAll('line').data(RAW_EDGES).join('line')
    .attr('class','link-hit')
    .attr('stroke','transparent').attr('stroke-width',10).style('cursor','pointer')
    .on('mouseover',(event,e)=>showEdgeTooltip(event,e))
    .on('mouseout',()=>{ document.getElementById('tooltip').style.display='none'; });

  // Node circles — hubs get gold ring
  const gNodes=gAll.append('g').attr('class','nodes');
  nodeSel=gNodes.selectAll('circle').data(RAW_NODES).join('circle')
    .attr('r',nodeRadius)
    .attr('fill',n=>CAT_CFG[n._cat].c)
    .attr('stroke',n=>n.kind==='hub'?'#FFD700':'#000')
    .attr('stroke-width',n=>n.kind==='hub'?3:1.5)
    .style('cursor','pointer')
    .call(d3.drag().on('start',dragStart).on('drag',dragged).on('end',dragEnd))
    .on('mouseover',(event,n)=>showNodeTooltip(event,n))
    .on('mouseout',()=>{ document.getElementById('tooltip').style.display='none'; })
    .on('click',(event,n)=>{ event.stopPropagation(); openInfoPanel(n.id); });

  // Labels — plant labels (toggleable) + hub labels (always on, gold bold)
  const gLabels=gAll.append('g').attr('class','labels');

  labelSel=gLabels.selectAll('text.plant-label')
    .data(RAW_NODES.filter(n=>n.kind!=='hub')).join('text')
    .attr('class','node-label plant-label')
    .attr('dy','0.35em')
    .attr('x',n=>nodeRadius(n)+2)
    .text(n=>n.id)
    .style('display',showLabels?null:'none');

  hubLabelSel=gLabels.selectAll('text.hub-label')
    .data(RAW_NODES.filter(n=>n.kind==='hub')).join('text')
    .attr('class','hub-label')
    .attr('dy','0.35em')
    .attr('x',n=>nodeRadius(n)+3)
    .text(n=>n.id);

  // ── Cluster force (registered, not in ticked) ──
  function clusterForce(alpha){
    if(!clusterMode) return;
    const keys=clusterMode==='cat'
      ? Object.keys(CAT_CFG).filter(k=>k!=='HB')
      : [...new Set(RAW_NODES.map(n=>n.form).filter(Boolean))];
    const R=0.34*Math.min(W,H);
    const centroids={};
    keys.forEach((k,i)=>{
      const a=(2*Math.PI*i)/keys.length - Math.PI/2;
      centroids[k]={x:W/2+R*Math.cos(a), y:H/2+R*Math.sin(a)};
    });
    const strength=0.055, maxV=8;
    RAW_NODES.forEach(n=>{
      let key=clusterMode==='cat' ? n._cat : n.form;
      if(n.kind==='hub' || !centroids[key]){
        n.vx+=(W/2-n.x)*strength*alpha; n.vy+=(H/2-n.y)*strength*alpha;
        n.vx=Math.max(-maxV,Math.min(maxV,n.vx)); n.vy=Math.max(-maxV,Math.min(maxV,n.vy));
        return;
      }
      const c=centroids[key];
      n.vx+=(c.x-n.x)*strength*alpha;
      n.vy+=(c.y-n.y)*strength*alpha;
      n.vx=Math.max(-maxV,Math.min(maxV,n.vx));
      n.vy=Math.max(-maxV,Math.min(maxV,n.vy));
    });
  }

  // ── Simulation ──
  simulation=d3.forceSimulation(RAW_NODES)
    .force('link', d3.forceLink(RAW_EDGES).id(d=>d.id)
      .distance(e=>{
        const sh=nodeById[sid(e)]?.kind==='hub', th=nodeById[tid(e)]?.kind==='hub';
        return (sh&&th)?200:(sh||th)?150:80;
      }).strength(0.4))
    .force('charge', d3.forceManyBody().strength(-160).distanceMax(400))
    .force('collide', d3.forceCollide(n=>nodeRadius(n)+4))
    .force('center',  d3.forceCenter(W/2,H/2))
    .force('cluster', clusterForce)
    .alphaDecay(0.02)
    .on('tick', ticked);

  // ── Zoom controls ──
  document.getElementById('zoom-in').addEventListener('click',()=>svg.transition().duration(250).call(zoom.scaleBy,1.5));
  document.getElementById('zoom-out').addEventListener('click',()=>svg.transition().duration(250).call(zoom.scaleBy,0.67));
  document.getElementById('zoom-reset').addEventListener('click',()=>svg.transition().duration(400)
    .call(zoom.transform, d3.zoomIdentity.translate(W/2,H/2).scale(0.8).translate(-W/2,-H/2)));

  applyFilters();

  function ticked(){
    // No manual cluster block here — handled by simulation.force('cluster', ...)
    linkVisSel
      .attr('x1',e=>sx(e)).attr('y1',e=>sy(e))
      .attr('x2',e=>tx(e)).attr('y2',e=>ty(e));
    linkHitSel
      .attr('x1',e=>sx(e)).attr('y1',e=>sy(e))
      .attr('x2',e=>tx(e)).attr('y2',e=>ty(e));
    nodeSel.attr('cx',n=>n.x).attr('cy',n=>n.y);
    labelSel.attr('x',n=>(n.x||0)+nodeRadius(n)+2).attr('y',n=>n.y||0);
    hubLabelSel.attr('x',n=>(n.x||0)+nodeRadius(n)+3).attr('y',n=>n.y||0);
  }

  function sx(e){const s=e.source;return typeof s==='object'?s.x:0;}
  function sy(e){const s=e.source;return typeof s==='object'?s.y:0;}
  function tx(e){const t=e.target;return typeof t==='object'?t.x:0;}
  function ty(e){const t=e.target;return typeof t==='object'?t.y:0;}

  function dragStart(event,n){if(!event.active)simulation.alphaTarget(0.3).restart();n.fx=n.x;n.fy=n.y;}
  function dragged(event,n){n.fx=event.x;n.fy=event.y;}
  function dragEnd(event,n){if(!event.active)simulation.alphaTarget(0);n.fx=null;n.fy=null;}

  // ── Enriched node tooltip ──
  function showNodeTooltip(event,n){
    const tt=document.getElementById('tooltip');
    const cat=CAT_CFG[n._cat];
    const wn=(n.water_need||'medium').replace(/_/g,' ');
    const flags=(n.flags||[]);
    let h=`<b>${n.id}</b><br/>`;
    h+=`<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${cat.c};margin-right:4px;vertical-align:middle"></span>${cat.l}<br/>`;
    if(n.name_sci) h+=`<i>${n.name_sci}</i><br/>`;
    if(n.name_ar)  h+=`<span style="direction:rtl;display:block;text-align:right">${n.name_ar}</span>`;
    if(n.form)     h+=`Form: ${n.form.replace(/_/g,' ')}<br/>`;
    h+=`Water: ${wn}<br/>`;
    if((n.function||[]).length) h+=`Fn: ${n.function.join(', ')}<br/>`;
    if((n.use||[]).length)      h+=`Use: ${n.use.join(', ')}<br/>`;
    h+=`Evidence: ${n.evidence_level||'Uncertain'}`;
    if(flags.length) h+=`<br/><span style="color:#ff8888">⚠ ${flags.join(', ')}</span>`;
    tt.innerHTML=h;
    posTooltip(event,tt);
  }

  // ── Enriched edge tooltip ──
  function showEdgeTooltip(event,e){
    const tt=document.getElementById('tooltip');
    const cfg=EDGE_CFG[e.type]||{label:e.type,color:'#888'};
    const conf=e.confidence!=null?Math.round(e.confidence*100)+'%':'—';
    const origin=e.source_id||e.origin||'';
    let h=`<b>${sid(e)}</b> → <b>${tid(e)}</b><br/>`;
    h+=`<span style="display:inline-block;width:14px;height:2px;background:${cfg.color};margin-right:4px;vertical-align:middle"></span>${cfg.label}`;
    if(e.added) h+=` <span style="color:#aaddff">✦ added</span>`;
    h+='<br/>';
    if(origin) h+=`Source: ${origin}<br/>`;
    h+=`Conf: ${conf} · ${e.evidence_level||'Uncertain'}`;
    if(e.evidence_quote) h+=`<br/><i>"${e.evidence_quote.substring(0,80)}${e.evidence_quote.length>80?'…':''}"</i>`;
    tt.innerHTML=h;
    posTooltip(event,tt);
  }

  function posTooltip(event,tt){
    const rect=document.getElementById('graph-area').getBoundingClientRect();
    let x=event.clientX-rect.left+12, y=event.clientY-rect.top-10;
    tt.style.display='block';
    if(x+230>rect.width) x=event.clientX-rect.left-tt.offsetWidth-12;
    tt.style.left=x+'px'; tt.style.top=y+'px';
  }
})();

// ── Incompatible IDs for garden ──
function getIncompatibleIds(){
  if(!gardenSet.size) return new Set();
  const hostile=new Set();
  RAW_EDGES.forEach(e=>{
    if(e.type!=='hostile') return;
    const s=sid(e), t=tid(e);
    if(gardenSet.has(s)) hostile.add(t);
    if(gardenSet.has(t)) hostile.add(s);
  });
  gardenSet.forEach(id=>hostile.delete(id));
  return hostile;
}

// ── Apply all filters ──
function applyFilters(){
  const incompatible=(hideIncompat&&gardenSet.size)?getIncompatibleIds():new Set();

  // Pass 1: node visibility
  const visibleNodes=new Set();
  RAW_NODES.forEach(n=>{
    if(!activeCats.has(n._cat)) return;
    if(!activeWater.has(n.water_need||'medium')) return;
    // Sub-cat filter: excluded subs within parent cat
    const sc=SUBCAT_LOOKUP[n.id];
    if(sc && excludedSubcats[sc.cat] && excludedSubcats[sc.cat].has(sc.sub)) return;
    if(hideIncompat && incompatible.has(n.id)) return;
    visibleNodes.add(n.id);
  });

  // Pass 1b: garden focus — keep only garden members + their direct neighbours (hubs always kept)
  if(gardenFocus && gardenSet.size){
    const related=new Set([...gardenSet]);
    RAW_EDGES.forEach(e=>{
      const s=sid(e), t=tid(e);
      if(gardenSet.has(s)) related.add(t);
      if(gardenSet.has(t)) related.add(s);
    });
    const toRemove=[];
    visibleNodes.forEach(id=>{ if(!related.has(id) && nodeById[id]?.kind!=='hub') toRemove.push(id); });
    toRemove.forEach(id=>visibleNodes.delete(id));
  }

  // Pass 2: edge visibility
  const visibleEdges=new Set();
  RAW_EDGES.forEach((e,i)=>{
    if(!activeEdges.has(e.type)) return;
    if(!visibleNodes.has(sid(e))||!visibleNodes.has(tid(e))) return;
    visibleEdges.add(i);
  });

  // Pass 3: orphan removal (two-pass, no mutation-during-iteration)
  if(hideOrphans){
    const connected=new Set();
    RAW_EDGES.forEach((e,i)=>{ if(visibleEdges.has(i)){ connected.add(sid(e)); connected.add(tid(e)); }});
    const toRemove=[];
    visibleNodes.forEach(id=>{ if(!connected.has(id)) toRemove.push(id); });
    toRemove.forEach(id=>visibleNodes.delete(id));
    const edgesToRemove=[];
    visibleEdges.forEach(i=>{ const e=RAW_EDGES[i]; if(!visibleNodes.has(sid(e))||!visibleNodes.has(tid(e))) edgesToRemove.push(i); });
    edgesToRemove.forEach(i=>visibleEdges.delete(i));
  }

  // Apply to DOM
  if(nodeSel){
    nodeSel.style('display', n=>visibleNodes.has(n.id)?null:'none');
  }
  if(labelSel){
    // Plant labels respect showLabels toggle
    labelSel.style('display', n=>(showLabels&&visibleNodes.has(n.id))?null:'none');
  }
  if(hubLabelSel){
    // Hub labels always on if hub node is visible
    hubLabelSel.style('display', n=>visibleNodes.has(n.id)?null:'none');
  }
  if(linkVisSel){
    linkVisSel.style('display',(_,i)=>visibleEdges.has(i)?null:'none');
    linkHitSel.style('display',(_,i)=>visibleEdges.has(i)?null:'none');
  }

  updateStats(visibleNodes, visibleEdges);
}

function updateStats(visibleNodes, visibleEdges){
  document.getElementById('stat-nodes').textContent=`${visibleNodes.size} / ${RAW_NODES.length}`;
  document.getElementById('stat-edges').textContent=`${visibleEdges.size} / ${RAW_EDGES.length}`;

  const typeCounts={};
  visibleEdges.forEach(i=>{ const t=RAW_EDGES[i].type||'unknown'; typeCounts[t]=(typeCounts[t]||0)+1; });
  const typeDiv=document.getElementById('stat-types');
  typeDiv.innerHTML='';
  Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).forEach(([t,cnt])=>{
    const cfg=EDGE_CFG[t];
    const row=document.createElement('div'); row.className='stat-type-row';
    const lbl=document.createElement('span'); lbl.textContent=cfg?cfg.label:t; lbl.style.color=cfg?cfg.color:'#888';
    const num=document.createElement('span'); num.textContent=cnt; num.style.color='#e0e0e0';
    row.appendChild(lbl); row.appendChild(num);
    typeDiv.appendChild(row);
  });

  const degree={};
  visibleEdges.forEach(i=>{
    const e=RAW_EDGES[i];
    const s=sid(e), t=tid(e);
    const sn=nodeById[s], tn=nodeById[t];
    if(sn&&sn.kind==='plant'&&visibleNodes.has(s)) degree[s]=(degree[s]||0)+1;
    if(tn&&tn.kind==='plant'&&visibleNodes.has(t)) degree[t]=(degree[t]||0)+1;
  });
  let top='—', topCount=0;
  Object.entries(degree).forEach(([id,cnt])=>{ if(cnt>topCount){topCount=cnt;top=id;} });
  document.getElementById('stat-top').textContent=top==='—'?'—':`${top} (${topCount})`;
}
</script>
</body>
</html>
